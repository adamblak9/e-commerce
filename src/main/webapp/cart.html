<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — ShopEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f8f5f0; --dark: #111009; --accent: #b8975a; --border: #e0d8cc; --white: #ffffff; }
        body { background: var(--bg); font-family: 'Outfit', sans-serif; color: var(--dark); margin: 0; }
        nav { padding: 0 3rem; height: 64px; background: var(--white); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; text-decoration: none; color: var(--dark); }
        .nav-brand span { color: var(--accent); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 380px; gap: 40px; }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; font-weight: 400; margin-top: 0; }

        .cart-items { background: var(--white); border-radius: 20px; border: 1px solid var(--border); overflow: hidden; }
        .item { display: flex; align-items: center; padding: 25px; border-bottom: 1px solid var(--border); }
        .item:last-child { border-bottom: none; }
        .item-img { width: 100px; height: 120px; background: #f4f1ec; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin-right: 25px; }
        .item-details { flex: 1; }
        .item-name { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; margin-bottom: 5px; }
        .item-price { font-weight: 600; color: var(--accent); }

        .qty-controls { display: flex; align-items: center; gap: 15px; border: 1px solid var(--border); padding: 5px 15px; border-radius: 100px; }
        .qty-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; padding: 0 5px; }
        .remove-link { color: #888; font-size: 0.8rem; text-decoration: underline; cursor: pointer; margin-top: 10px; display: block; }

        .summary-card { background: var(--dark); color: #fff; padding: 35px; border-radius: 24px; height: fit-content; position: sticky; top: 100px; }
        .summary-card h2 { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .row { display: flex; justify-content: space-between; margin: 15px 0; font-weight: 300; }
        .total { font-size: 1.4rem; font-weight: 600; margin-top: 25px; border-top: 1px solid #333; padding-top: 20px; color: var(--accent); }

        .checkout-btn { width: 100%; background: var(--accent); color: white; border: none; padding: 18px; border-radius: 12px; font-family: 'Outfit'; font-weight: 600; font-size: 1rem; cursor: pointer; margin-top: 25px; transition: 0.3s; }
        .checkout-btn:hover { background: #d4b07a; transform: translateY(-2px); }
        .checkout-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .empty-state { grid-column: 1 / -1; text-align: center; padding: 100px 0; }
    </style>
</head>
<body>

<nav><a href="store.html" class="nav-brand">Shop<span>Ease</span></a></nav>

<div class="container" id="cartContainer">
    <div>
        <h1>Shopping Bag</h1>
        <div class="cart-items" id="cartList"></div>
    </div>

    <div class="summary-card">
        <h2>Order Summary</h2>
        <div class="row"><span>Subtotal</span> <span id="subtotal">$0.00</span></div>
        <div class="row"><span>Shipping</span> <span>Calculated at next step</span></div>
        <div class="row total"><span>Total</span> <span id="total">$0.00</span></div>

        <input type="text" id="address" placeholder="Shipping Address..."
               style="width:100%; padding:12px; border-radius:8px; border:none; margin-top:15px; background:#222; color:#fff;">

        <button class="checkout-btn" id="checkoutBtn" onclick="checkout()">Checkout Now</button>
    </div>
</div>

<script>
    let cart = JSON.parse(localStorage.getItem('cart') || '[]');

    function render() {
        const list = document.getElementById('cartList');
        if (cart.length === 0) {
            document.getElementById('cartContainer').innerHTML =
                `<div class="empty-state"><h2>Your bag is empty</h2><a href="store.html" style="color:var(--accent)">Continue Shopping</a></div>`;
            return;
        }

        list.innerHTML = cart.map((item, i) => `
            <div class="item">
                <div class="item-img">🛍️</div>
                <div class="item-details">
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">$${item.price.toFixed(2)}</div>
                    <span class="remove-link" onclick="remove(${i})">Remove item</span>
                </div>
                <div class="qty-controls">
                    <button class="qty-btn" onclick="updateQty(${i}, -1)">-</button>
                    <span>${item.qty}</span>
                    <button class="qty-btn" onclick="updateQty(${i}, 1)">+</button>
                </div>
            </div>
        `).join('');

        const sum = cart.reduce((a, b) => a + (b.price * b.qty), 0);
        document.getElementById('subtotal').textContent = `$${sum.toFixed(2)}`;
        document.getElementById('total').textContent    = `$${sum.toFixed(2)}`;
    }

    function updateQty(i, d) {
        cart[i].qty = Math.max(1, cart[i].qty + d);
        localStorage.setItem('cart', JSON.stringify(cart));
        render();
    }

    function remove(i) {
        cart.splice(i, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        render();
    }

    async function checkout() {
        const addr = document.getElementById('address').value.trim();
        if (!addr) { alert("Please enter a shipping address"); return; }

        const user = JSON.parse(localStorage.getItem('user') || 'null');
        if (!user) { window.location.href = 'login.html'; return; }

        const total = cart.reduce((a, b) => a + (b.price * b.qty), 0);

        // ← FIX: include `name` in every item so the backend can save it
        const payload = {
            items: cart.map(item => ({
                productId: item.id,
                quantity:  item.qty,
                price:     item.price,
                name:      item.name        // ← product name saved in order_items
            })),
            total:   total,
            address: addr
        };

        const btn = document.getElementById('checkoutBtn');
        btn.disabled    = true;
        btn.textContent = 'Processing…';

        try {
            const res = await fetch('/ecommerce/api/orders', {
                method:  'POST',
                headers: {
                    'Content-Type':  'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('token')
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (res.ok) {
                // ← Keep cart in localStorage so payment.html can show product names instantly
                // (it will be cleared after successful payment)
                window.location.href = `payment.html?orderId=${data.orderId}&amount=${total.toFixed(2)}`;
            } else {
                alert(data.error || data.message || 'Checkout failed');
                btn.disabled    = false;
                btn.textContent = 'Checkout Now';
            }
        } catch (e) {
            alert("Server error. Please try again.");
            btn.disabled    = false;
            btn.textContent = 'Checkout Now';
        }
    }

    render();
</script>
</body>
</html>
