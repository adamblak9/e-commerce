<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Store — ShopEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #f8f5f0;
            --bg2:       #f0ebe2;
            --dark:      #111009;
            --panel:     #1a1810;
            --accent:    #b8975a;
            --accent2:   #d4b07a;
            --text:      #1a1810;
            --muted:     #8a8278;
            --border:    #e0d8cc;
            --white:     #ffffff;
            --sidebar-w: 260px;
        }

        html { scroll-behavior: smooth; }
        body {
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            min-height: 100vh;
        }

        a { text-decoration: none; color: inherit; }

        /* ═══════════════════════════════════════
           NAVBAR
        ═══════════════════════════════════════ */
        nav {
            position: sticky;
            top: 0; z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 3rem;
            height: 64px;
            background: rgba(248,245,240,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        .nav-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--dark);
        }
        .nav-brand span { color: var(--accent); }

        .nav-right { display: flex; align-items: center; gap: 1rem; }

        .nav-user {
            display: flex; align-items: center; gap: 0.6rem;
            font-size: 0.88rem; color: var(--muted);
        }

        .nav-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-size: 0.78rem; font-weight: 600; color: var(--white);
        }

        .btn-sm {
            padding: 0.45rem 1rem;
            border-radius: 100px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-outline {
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
        }
        .btn-outline:hover { border-color: var(--accent); color: var(--accent); }

        .btn-dark {
            border: 1px solid var(--dark);
            background: var(--dark);
            color: var(--white);
        }
        .btn-dark:hover { background: var(--panel); }

        .cart-btn {
            position: relative;
            width: 36px; height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--white);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .cart-btn:hover { border-color: var(--accent); }

        .cart-count {
            position: absolute;
            top: -4px; right: -4px;
            width: 16px; height: 16px;
            background: var(--accent);
            color: var(--white);
            border-radius: 50%;
            font-size: 0.6rem;
            font-weight: 600;
            display: flex; align-items: center; justify-content: center;
        }

        /* ═══════════════════════════════════════
           LAYOUT
        ═══════════════════════════════════════ */
        .page {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: calc(100vh - 64px);
        }

        /* ═══════════════════════════════════════
           SIDEBAR
        ═══════════════════════════════════════ */
        .sidebar {
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            background: var(--white);
            position: sticky;
            top: 64px;
            height: calc(100vh - 64px);
            overflow-y: auto;
        }

        .filter-section { margin-bottom: 2rem; }

        .filter-title {
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 1px solid var(--border);
        }

        /* Search */
        .search-wrap {
            position: relative;
            margin-bottom: 0.5rem;
        }

        .search-wrap input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.4rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            font-size: 0.88rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrap input:focus { border-color: var(--accent); }
        .search-wrap input::placeholder { color: #bbb; }

        .search-icon {
            position: absolute;
            left: 0.8rem; top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        /* Categories */
        .cat-list { list-style: none; }

        .cat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.6rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.15s, color 0.15s;
            margin-bottom: 2px;
        }
        .cat-item:hover { background: var(--bg2); }
        .cat-item.active { background: var(--dark); color: var(--white); }
        .cat-item.active .cat-count { background: rgba(255,255,255,0.2); color: var(--white); }

        .cat-count {
            font-size: 0.72rem;
            background: var(--bg2);
            color: var(--muted);
            padding: 0.15rem 0.5rem;
            border-radius: 100px;
        }

        /* Price range */
        .price-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }

        .price-inputs input {
            width: 100%;
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg);
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .price-inputs input:focus { border-color: var(--accent); }

        .price-slider {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .apply-btn {
            width: 100%;
            padding: 0.65rem;
            background: var(--dark);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: background 0.2s;
        }
        .apply-btn:hover { background: var(--panel); }

        .clear-btn {
            width: 100%;
            padding: 0.55rem;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.82rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }
        .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* ═══════════════════════════════════════
           MAIN CONTENT
        ═══════════════════════════════════════ */
        .main { padding: 2rem; }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .results-count {
            font-size: 0.88rem;
            color: var(--muted);
        }
        .results-count strong { color: var(--text); }

        .sort-wrap { display: flex; align-items: center; gap: 0.6rem; }

        .sort-wrap label {
            font-size: 0.82rem;
            color: var(--muted);
        }

        .sort-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--white);
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .sort-select:focus { border-color: var(--accent); }

        /* Active filters pills */
        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .filter-pill {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            background: var(--dark);
            color: var(--white);
            border-radius: 100px;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .pill-remove {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            font-size: 0.9rem;
            line-height: 1;
        }
        .pill-remove:hover { opacity: 1; }

        /* ═══════════════════════════════════════
           PRODUCT GRID
        ═══════════════════════════════════════ */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.1);
        }

        .pc-img {
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--bg2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5rem;
            position: relative;
            overflow: hidden;
        }

        .pc-img img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        .product-card:hover .pc-img img { transform: scale(1.05); }

        .pc-img .no-img {
            font-size: 4rem;
            color: var(--border);
        }

        .pc-badge {
            position: absolute;
            top: 0.8rem; left: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-new  { background: var(--dark);  color: var(--white); }
        .badge-out  { background: #e07070;      color: var(--white); }

        .pc-wishlist {
            position: absolute;
            top: 0.8rem; right: 0.8rem;
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--white);
            border: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .product-card:hover .pc-wishlist { opacity: 1; }
        .pc-wishlist:hover { transform: scale(1.15); }
        .pc-wishlist.liked { opacity: 1; color: #e07070; }

        .pc-body { padding: 1rem 1.2rem 1.2rem; }

        .pc-category {
            font-size: 0.72rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }

        .pc-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--dark);
            margin-bottom: 0.3rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pc-desc {
            font-size: 0.8rem;
            color: var(--muted);
            font-weight: 300;
            margin-bottom: 0.8rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .pc-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pc-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark);
        }

        .pc-stock {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.2rem;
        }
        .pc-stock.low { color: #e07070; }

        .btn-add {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--dark);
            border: none;
            color: var(--white);
            font-size: 1.2rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.15s;
            flex-shrink: 0;
        }
        .btn-add:hover { background: var(--accent); transform: scale(1.1); }
        .btn-add:disabled { background: var(--border); cursor: not-allowed; transform: none; }

        /* ═══════════════════════════════════════
           STATES
        ═══════════════════════════════════════ */
        .loading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
        }

        .skeleton {
            background: var(--white);
            border-radius: 16px;
            overflow: hidden;
            animation: pulse 1.5s ease infinite;
        }

        .skeleton-img {
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--bg2);
        }

        .skeleton-body { padding: 1rem 1.2rem 1.2rem; }

        .skeleton-line {
            height: 12px;
            background: var(--bg2);
            border-radius: 6px;
            margin-bottom: 0.6rem;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50%       { opacity: 0.6; }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
        }

        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        .empty-state h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .empty-state p { color: var(--muted); font-size: 0.9rem; }

        /* ═══════════════════════════════════════
           PAGINATION
        ═══════════════════════════════════════ */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 3rem;
            padding-bottom: 2rem;
        }

        .page-btn {
            width: 36px; height: 36px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--white);
            font-family: 'Outfit', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .page-btn:hover    { border-color: var(--accent); color: var(--accent); }
        .page-btn.active   { background: var(--dark); border-color: var(--dark); color: var(--white); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ═══════════════════════════════════════
           TOAST
        ═══════════════════════════════════════ */
        .toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            background: var(--dark);
            color: var(--white);
            padding: 0.8rem 1.4rem;
            border-radius: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            z-index: 999;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 900px) {
            .page { grid-template-columns: 1fr; }
            .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
            nav { padding: 0 1.5rem; }
            .main { padding: 1.5rem; }
        }
    </style>
</head>
<body>

<!-- ══ NAVBAR ══════════════════════════════════════ -->
<nav>
    <a href="index.html" class="nav-brand">Shop<span>Ease</span></a>
    <div class="nav-right">
        <div class="nav-user" id="navUser" style="display:none;">
            <div class="nav-avatar" id="navAvatar">J</div>
            <span id="navName">John</span>
        </div>
        <div id="navGuest" style="display:none;">
            <a href="login.html"><button class="btn-sm btn-outline">Sign In</button></a>
        </div>
        <button class="cart-btn" onclick="goToCart()">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</nav>

<div class="page">

    <!-- ══ SIDEBAR ════════════════════════════════════ -->
    <aside class="sidebar">

        <!-- Search -->
        <div class="filter-section">
            <div class="filter-title">Search</div>
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search products…" oninput="onSearch()"/>
            </div>
        </div>

        <!-- Categories -->
        <div class="filter-section">
            <div class="filter-title">Category</div>
            <ul class="cat-list" id="catList">
                <li class="cat-item active" data-cat="" onclick="selectCategory(this, '')">
                    All <span class="cat-count" id="countAll">—</span>
                </li>
            </ul>
        </div>

        <!-- Price -->
        <div class="filter-section">
            <div class="filter-title">Price Range</div>
            <div class="price-inputs">
                <input type="number" id="priceMin" placeholder="Min $" min="0"/>
                <input type="number" id="priceMax" placeholder="Max $" min="0"/>
            </div>
            <input type="range" class="price-slider" id="priceSlider"
                   min="0" max="1000" value="1000" oninput="onSlider(this.value)"/>
            <button class="apply-btn" onclick="applyFilters()">Apply Filters</button>
            <button class="clear-btn" onclick="clearFilters()">Clear All</button>
        </div>

    </aside>

    <!-- ══ MAIN ════════════════════════════════════════ -->
    <main class="main">

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="results-count" id="resultsCount">Loading products…</div>
            <div class="sort-wrap">
                <label>Sort by</label>
                <select class="sort-select" id="sortSelect" onchange="applyFilters()">
                    <option value="newest">Newest</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="popular">Most Popular</option>
                </select>
            </div>
        </div>

        <!-- Active filter pills -->
        <div class="active-filters" id="activePills"></div>

        <!-- Products -->
        <div id="productsContainer">
            <!-- skeleton loading -->
            <div class="loading-grid" id="skeletonGrid">
                ${Array(8).fill(`
                <div class="skeleton">
                    <div class="skeleton-img"></div>
                    <div class="skeleton-body">
                        <div class="skeleton-line" style="width:40%"></div>
                        <div class="skeleton-line" style="width:70%"></div>
                        <div class="skeleton-line" style="width:55%"></div>
                    </div>
                </div>
                `).join('')}
            </div>
            <div class="products-grid" id="productsGrid" style="display:none;"></div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>

    </main>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    // ── State ────────────────────────────────────────
    const BASE = 'http://localhost:8080/ecommerce/api';
    let allProducts  = [];
    let filtered     = [];
    let currentPage  = 1;
    const PAGE_SIZE  = 12;
    let cartItems    = JSON.parse(localStorage.getItem('cart') || '[]');
    let selectedCat  = '';
    let searchTimer  = null;

    const token = localStorage.getItem('token');
    const user  = JSON.parse(localStorage.getItem('user') || 'null');

    // ── Init ─────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
        initNav();
        updateCartCount();
        fetchProducts();
    });

    function initNav() {
        if (user) {
            document.getElementById('navUser').style.display = 'flex';
            document.getElementById('navName').textContent   = user.firstName;
            document.getElementById('navAvatar').textContent =
                (user.firstName?.[0] || '') + (user.lastName?.[0] || '');
        } else {
            document.getElementById('navGuest').style.display = 'block';
        }
    }

    // ── Fetch products ───────────────────────────────
    async function fetchProducts() {
        try {
            const res  = await fetch(`${BASE}/products`);
            const data = await res.json();
            allProducts = Array.isArray(data) ? data : (data.products || []);

            // Only show ACTIVE products
            allProducts = allProducts.filter(p => p.status === 'ACTIVE');

            buildCategories();
            applyFilters();

        } catch (err) {
            showEmpty('Could not load products', 'Make sure the server is running.');
        } finally {
            document.getElementById('skeletonGrid').style.display = 'none';
            document.getElementById('productsGrid').style.display = 'grid';
        }
    }

    // ── Build category list from products ────────────
    function buildCategories() {
        const counts = {};
        allProducts.forEach(p => {
            const c = p.category || 'Uncategorized';
            counts[c] = (counts[c] || 0) + 1;
        });

        document.getElementById('countAll').textContent = allProducts.length;

        const list = document.getElementById('catList');
        Object.entries(counts).sort().forEach(([cat, count]) => {
            const li = document.createElement('li');
            li.className = 'cat-item';
            li.dataset.cat = cat;
            li.onclick = () => selectCategory(li, cat);
            li.innerHTML = `${cat} <span class="cat-count">${count}</span>`;
            list.appendChild(li);
        });
    }

    // ── Category select ──────────────────────────────
    function selectCategory(el, cat) {
        document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        selectedCat = cat;
        currentPage = 1;
        applyFilters();
    }

    // ── Search (debounced) ───────────────────────────
    function onSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            currentPage = 1;
            applyFilters();
        }, 300);
    }

    // ── Slider syncs to max price input ──────────────
    function onSlider(val) {
        document.getElementById('priceMax').value = val;
    }

    // ── Apply all filters + sort ─────────────────────
    function applyFilters() {
        const search   = document.getElementById('searchInput').value.trim().toLowerCase();
        const minPrice = parseFloat(document.getElementById('priceMin').value) || 0;
        const maxPrice = parseFloat(document.getElementById('priceMax').value) || Infinity;
        const sort     = document.getElementById('sortSelect').value;

        filtered = allProducts.filter(p => {
            const matchCat    = !selectedCat || p.category === selectedCat;
            const matchSearch = !search ||
                p.name.toLowerCase().includes(search) ||
                (p.description || '').toLowerCase().includes(search);
            const price       = parseFloat(p.price) || 0;
            const matchPrice  = price >= minPrice && price <= maxPrice;
            return matchCat && matchSearch && matchPrice;
        });

        // Sort
        filtered.sort((a, b) => {
            if (sort === 'price_asc')  return a.price - b.price;
            if (sort === 'price_desc') return b.price - a.price;
            if (sort === 'newest')     return new Date(b.createdAt) - new Date(a.createdAt);
            return 0; // popular — keep server order
        });

        updatePills(search, minPrice, maxPrice);
        renderPage();
        renderPagination();
        updateResultsCount();
    }

    // ── Render current page ──────────────────────────
    function renderPage() {
        const grid  = document.getElementById('productsGrid');
        const start = (currentPage - 1) * PAGE_SIZE;
        const page  = filtered.slice(start, start + PAGE_SIZE);

        if (filtered.length === 0) {
            grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <h3>No products found</h3>
            <p>Try adjusting your filters or search term.</p>
          </div>`;
            return;
        }

        grid.innerHTML = page.map(p => productCard(p)).join('');
    }

    // ── Product card HTML ────────────────────────────
    function productCard(p) {
        const price    = parseFloat(p.price).toFixed(2);
        const isNew    = isNewProduct(p.createdAt);
        const isOut    = p.status === 'OUT_OF_STOCK' || p.stockQuantity === 0;
        const lowStock = p.stockQuantity > 0 && p.stockQuantity <= 5;

        const imgHtml = p.imageUrl
            ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy"/>`
            : `<span class="no-img">🛍️</span>`;

        const badge = isOut
            ? `<span class="pc-badge badge-out">Out of Stock</span>`
            : isNew ? `<span class="pc-badge badge-new">New</span>` : '';

        const stockText = isOut
            ? `<div class="pc-stock low">Out of stock</div>`
            : lowStock
                ? `<div class="pc-stock low">Only ${p.stockQuantity} left</div>`
                : `<div class="pc-stock">${p.stockQuantity} in stock</div>`;

        return `
        <div class="product-card" onclick="viewProduct(${p.id})">
          <div class="pc-img">
            ${imgHtml}
            ${badge}
            <button class="pc-wishlist" onclick="toggleWishlist(event, ${p.id})">🤍</button>
          </div>
          <div class="pc-body">
            <div class="pc-category">${p.category || 'General'}</div>
            <div class="pc-name">${p.name}</div>
            <div class="pc-desc">${p.description || ''}</div>
            <div class="pc-footer">
              <div>
                <div class="pc-price">$${price}</div>
                ${stockText}
              </div>
              <button class="btn-add"
                ${isOut ? 'disabled' : ''}
                onclick="addToCart(event, ${p.id}, '${p.name}', ${p.price})">
                +
              </button>
            </div>
          </div>
        </div>`;
    }

    // ── Pagination ───────────────────────────────────
    function renderPagination() {
        const total = Math.ceil(filtered.length / PAGE_SIZE);
        const el    = document.getElementById('pagination');
        if (total <= 1) { el.innerHTML = ''; return; }

        let html = `<button class="page-btn" onclick="goPage(${currentPage-1})"
        ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;

        for (let i = 1; i <= total; i++) {
            if (i === 1 || i === total || Math.abs(i - currentPage) <= 1) {
                html += `<button class="page-btn ${i===currentPage?'active':''}"
            onclick="goPage(${i})">${i}</button>`;
            } else if (Math.abs(i - currentPage) === 2) {
                html += `<span style="color:var(--muted);padding:0 4px;">…</span>`;
            }
        }

        html += `<button class="page-btn" onclick="goPage(${currentPage+1})"
        ${currentPage === total ? 'disabled' : ''}>›</button>`;

        el.innerHTML = html;
    }

    function goPage(n) {
        const total = Math.ceil(filtered.length / PAGE_SIZE);
        if (n < 1 || n > total) return;
        currentPage = n;
        renderPage();
        renderPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ── Active pills ─────────────────────────────────
    function updatePills(search, min, max) {
        const el = document.getElementById('activePills');
        let html = '';

        if (selectedCat)
            html += pill(`Category: ${selectedCat}`, `selectCategory(document.querySelector('.cat-item[data-cat=""]'), '')`);
        if (search)
            html += pill(`Search: "${search}"`, `document.getElementById('searchInput').value=''; applyFilters()`);
        if (min > 0 || max < Infinity)
            html += pill(`Price: $${min}–$${max < Infinity ? max : '∞'}`, `clearPrice()`);

        el.innerHTML = html;
    }

    function pill(label, action) {
        return `<div class="filter-pill">${label}
        <span class="pill-remove" onclick="${action}">✕</span>
      </div>`;
    }

    function clearPrice() {
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('priceSlider').value = 1000;
        applyFilters();
    }

    function clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('priceMin').value    = '';
        document.getElementById('priceMax').value    = '';
        document.getElementById('priceSlider').value = 1000;
        selectCategory(document.querySelector('.cat-item[data-cat=""]'), '');
    }

    // ── Results count ────────────────────────────────
    function updateResultsCount() {
        const el    = document.getElementById('resultsCount');
        const start = (currentPage - 1) * PAGE_SIZE + 1;
        const end   = Math.min(currentPage * PAGE_SIZE, filtered.length);
        el.innerHTML = filtered.length === 0
            ? 'No products found'
            : `Showing <strong>${start}–${end}</strong> of <strong>${filtered.length}</strong> products`;
    }

    // ── Cart ─────────────────────────────────────────
    function addToCart(e, id, name, price) {
        e.stopPropagation();

        const existing = cartItems.find(i => i.id === id);
        if (existing) {
            existing.qty++;
        } else {
            cartItems.push({ id, name, price: parseFloat(price), qty: 1 });
        }

        localStorage.setItem('cart', JSON.stringify(cartItems));
        updateCartCount();
        showToast(`"${name}" added to cart 🛒`);
    }

    function updateCartCount() {
        const total = cartItems.reduce((sum, i) => sum + i.qty, 0);
        document.getElementById('cartCount').textContent = total;
    }

    function goToCart() { window.location.href = 'cart.html'; }

    // ── Wishlist ─────────────────────────────────────
    function toggleWishlist(e, id) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const liked = btn.classList.toggle('liked');
        btn.textContent = liked ? '❤️' : '🤍';
        showToast(liked ? 'Added to wishlist ❤️' : 'Removed from wishlist');
    }

    // ── View product ─────────────────────────────────
    function viewProduct(id) {
        window.location.href = `product.html?id=${id}`;
    }

    // ── Helpers ──────────────────────────────────────
    function isNewProduct(dateStr) {
        if (!dateStr) return false;
        const days = (Date.now() - new Date(dateStr)) / (1000 * 60 * 60 * 24);
        return days <= 30;
    }

    function showEmpty(title, msg) {
        document.getElementById('skeletonGrid').style.display = 'none';
        document.getElementById('productsGrid').style.display = 'grid';
        document.getElementById('productsGrid').innerHTML = `
        <div class="empty-state">
          <div class="icon">😕</div>
          <h3>${title}</h3>
          <p>${msg}</p>
        </div>`;
        document.getElementById('resultsCount').textContent = '';
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
