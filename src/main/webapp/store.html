<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Store — ShopEase</title>
    <!-- Same fonts as login: Fraunces (serif) + DM Sans (sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:         #ffffff;
            --panel:      #f9f9f8;
            --border:     #e8e8e6;
            --border2:    #d4d4d0;
            --accent:     #1a6ef5;
            --accent2:    #4488ff;
            --accentL:    rgba(26,110,245,0.08);
            --text:       #111110;
            --text2:      #3a3a38;
            --muted:      #888886;
            --error:      #e53535;
            --success:    #18a058;
            --warning:    #e68a2e;
            --shadow-sm:  0 4px 12px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
            --sidebar-w:  260px;
            --nav-h:      70px;
        }

        body {
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ----- Navigation (mirrors login) ----- */
        nav {
            position: sticky;
            top: 0;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: var(--nav-h);
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            transition: box-shadow 0.3s;
        }
        nav.scrolled {
            box-shadow: var(--shadow-sm);
        }

        .nav-brand {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
        }
        .nav-brand span {
            color: var(--accent);
        }

        .nav-center {
            display: flex;
            gap: 2rem;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-link {
            font-size: 0.88rem;
            font-weight: 500;
            color: var(--muted);
            padding: 0.25rem 0;
            border-bottom: 2px solid transparent;
            transition: color 0.2s, border-color 0.2s;
        }
        .nav-link:hover,
        .nav-link.active {
            color: var(--text);
            border-bottom-color: var(--accent);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Cart button */
        .cart-btn {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: border-color 0.2s, transform 0.2s;
        }
        .cart-btn:hover {
            border-color: var(--accent);
            transform: scale(1.04);
        }
        .cart-count {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: var(--accent);
            color: white;
            border-radius: 50%;
            font-size: 0.62rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        .cart-count.bump {
            transform: scale(1.3);
        }

        /* User dropdown */
        .user-menu {
            position: relative;
        }
        .user-trigger {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.7rem 0.3rem 0.3rem;
            border: 1px solid var(--border);
            border-radius: 40px;
            background: var(--bg);
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .user-trigger:hover {
            border-color: var(--accent);
            background: var(--panel);
        }
        .nav-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
            flex-shrink: 0;
        }
        .user-trigger .name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text);
        }
        .chevron {
            font-size: 0.65rem;
            color: var(--muted);
            transition: transform 0.25s;
            display: inline-block;
        }
        .user-menu.open .chevron {
            transform: rotate(180deg);
        }

        .dropdown {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 220px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 0.5rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            opacity: 0;
            transform: translateY(-8px) scale(0.97);
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
        }
        .user-menu.open .dropdown {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .dd-header {
            padding: 0.5rem 0.8rem 0.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.35rem;
        }
        .dd-name {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .dd-email {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 2px;
        }
        .dd-role {
            display: inline-block;
            margin-top: 5px;
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            padding: 0.2rem 0.55rem;
            border-radius: 30px;
            background: var(--panel);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .dd-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.5rem 0.8rem;
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--text2);
            cursor: pointer;
            transition: background 0.15s;
        }
        .dd-item:hover {
            background: var(--panel);
        }
        .dd-item .icon {
            font-size: 1rem;
            color: var(--muted);
        }
        .dd-sep {
            height: 1px;
            background: var(--border);
            margin: 0.35rem 0;
        }
        .dd-item.logout {
            color: var(--error);
        }
        .dd-item.logout .icon {
            color: var(--error);
        }

        /* Guest buttons */
        .btn-sm {
            padding: 0.45rem 1.1rem;
            border-radius: 40px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .btn-outline {
            border: 1px solid var(--border) !important;
            background: transparent;
            color: var(--text2);
        }
        .btn-outline:hover {
            border-color: var(--accent) !important;
            color: var(--accent);
        }
        .btn-dark {
            background: var(--text);
            color: white;
        }
        .btn-dark:hover {
            background: var(--text2);
        }

        /* ----- Layout (sidebar + main) ----- */
        .page {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: calc(100vh - var(--nav-h));
        }

        /* Sidebar (light theme) */
        .sidebar {
            border-right: 1px solid var(--border);
            padding: 2rem 1.5rem;
            background: var(--bg);
            position: sticky;
            top: var(--nav-h);
            height: calc(100vh - var(--nav-h));
            overflow-y: auto;
        }
        .filter-section {
            margin-bottom: 2rem;
        }
        .filter-title {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        .search-wrap {
            position: relative;
            margin-bottom: 0.5rem;
        }
        .search-wrap input {
            width: 100%;
            padding: 0.7rem 1rem 0.7rem 2.4rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
        }
        .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accentL);
            background: var(--bg);
        }
        .search-wrap input::placeholder {
            color: var(--border2);
        }
        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .cat-list {
            list-style: none;
        }
        .cat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0.6rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.15s, color 0.15s;
            margin-bottom: 2px;
        }
        .cat-item:hover {
            background: var(--panel);
        }
        .cat-item.active {
            background: var(--accentL);
            color: var(--accent);
            font-weight: 500;
        }
        .cat-count {
            font-size: 0.7rem;
            background: var(--panel);
            color: var(--muted);
            padding: 0.15rem 0.5rem;
            border-radius: 30px;
        }

        .price-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 0.8rem;
        }
        .price-inputs input {
            width: 100%;
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            outline: none;
            transition: border 0.15s;
        }
        .price-inputs input:focus {
            border-color: var(--accent);
        }
        .price-slider {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }
        .apply-btn {
            width: 100%;
            padding: 0.6rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 0.8rem;
            transition: background 0.2s;
        }
        .apply-btn:hover {
            background: var(--accent2);
        }
        .clear-btn {
            width: 100%;
            padding: 0.55rem;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: all 0.2s;
        }
        .clear-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Main area */
        .main {
            padding: 2rem;
        }
        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .results-count {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .results-count strong {
            color: var(--text);
        }
        .sort-wrap {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .sort-wrap label {
            font-size: 0.8rem;
            color: var(--muted);
        }
        .sort-select {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--text);
            outline: none;
            cursor: pointer;
        }
        .sort-select:focus {
            border-color: var(--accent);
        }

        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }
        .filter-pill {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.3rem 0.8rem;
            background: var(--accentL);
            color: var(--accent);
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .pill-remove {
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.2s;
            font-size: 0.9rem;
            line-height: 1;
        }
        .pill-remove:hover {
            opacity: 1;
        }

        /* Products grid */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-sm);
            border-color: var(--accentL);
        }
        .pc-img {
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .pc-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s;
        }
        .product-card:hover .pc-img img {
            transform: scale(1.05);
        }
        .no-img {
            font-size: 3rem;
            color: var(--border2);
        }
        .pc-badge {
            position: absolute;
            top: 0.8rem;
            left: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .badge-new {
            background: var(--accent);
            color: white;
        }
        .badge-out {
            background: rgba(229, 53, 53, 0.9);
            color: white;
        }
        .pc-wishlist {
            position: absolute;
            top: 0.8rem;
            right: 0.8rem;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--bg);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            box-shadow: var(--shadow-sm);
        }
        .product-card:hover .pc-wishlist {
            opacity: 1;
        }
        .pc-wishlist:hover {
            transform: scale(1.15);
        }
        .pc-wishlist.liked {
            opacity: 1;
            color: var(--error);
        }
        .pc-body {
            padding: 1rem 1.2rem 1.2rem;
        }
        .pc-category {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.3rem;
        }
        .pc-name {
            font-family: 'Fraunces', serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pc-desc {
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.4;
            margin-bottom: 0.8rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .pc-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .pc-price {
            font-family: 'Fraunces', serif;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }
        .pc-stock {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 0.2rem;
        }
        .pc-stock.low {
            color: var(--warning);
        }
        .btn-add {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, transform 0.2s;
        }
        .btn-add:hover {
            background: var(--accent2);
            transform: scale(1.1);
        }
        .btn-add:disabled {
            background: var(--border2);
            cursor: not-allowed;
            transform: none;
        }

        /* Skeleton */
        .loading-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        .skeleton {
            background: var(--bg);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            animation: pulse 1.5s infinite ease;
        }
        .skeleton-img {
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--panel);
        }
        .skeleton-body {
            padding: 1rem 1.2rem 1.2rem;
        }
        .skeleton-line {
            height: 12px;
            background: var(--panel);
            border-radius: 6px;
            margin-bottom: 0.6rem;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
        }
        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .empty-state h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .empty-state p {
            color: var(--muted);
        }

        /* Pagination */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 3rem;
            padding-bottom: 2rem;
        }
        .page-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            color: var(--text2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .page-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .page-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: var(--text);
            color: white;
            padding: 0.7rem 1.2rem;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 780px) {
            .page {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
            .nav-center {
                display: none;
            }
            nav {
                padding: 0 1rem;
            }
            .main {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>

<nav id="mainNav">
    <a href="index.html" class="nav-brand">Shop<span>Ease</span></a>
    <div class="nav-center">
        <a href="store.html" class="nav-link active">Store</a>
        <a href="#" class="nav-link">New Arrivals</a>
        <a href="#" class="nav-link">Deals</a>
        <a href="#" class="nav-link">About</a>
    </div>
    <div class="nav-right">
        <!-- Logged-in user menu -->
        <div class="user-menu" id="userMenu" style="display:none">
            <div class="user-trigger" onclick="toggleDropdown()">
                <div class="nav-avatar" id="navAvatar">JD</div>
                <span class="name" id="navName">John</span>
                <span class="chevron">▼</span>
            </div>
            <div class="dropdown" id="dropdown">
                <div class="dd-header">
                    <div class="dd-name" id="ddFullName">John Doe</div>
                    <div class="dd-email" id="ddEmail">john@example.com</div>
                    <span class="dd-role" id="ddRole">Customer</span>
                </div>
                <div class="dd-item" onclick="window.location.href='profile.html'">
                    <span class="icon">👤</span> My Profile
                </div>
                <div class="dd-item" onclick="window.location.href='orders.html'">
                    <span class="icon">📦</span> My Orders
                </div>
                <div class="dd-item" id="dashboardLink" style="display:none" onclick="window.location.href='dashboard.html'">
                    <span class="icon">⚙️</span> Seller Dashboard
                </div>
                <div class="dd-sep"></div>
                <div class="dd-item logout" onclick="handleLogout()">
                    <span class="icon">🚪</span> Sign Out
                </div>
            </div>
        </div>
        <!-- Guest buttons -->
        <div id="guestBtns" style="display:none; gap:0.5rem; align-items:center">
            <a href="login.html"><button class="btn-sm btn-outline">Sign In</button></a>
            <a href="signup.html"><button class="btn-sm btn-dark">Sign Up</button></a>
        </div>
        <button class="cart-btn" onclick="goToCart()">
            🛒<span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</nav>

<div class="page">
    <aside class="sidebar">
        <div class="filter-section">
            <div class="filter-title">Search</div>
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search products…" oninput="onSearch()"/>
            </div>
        </div>
        <div class="filter-section">
            <div class="filter-title">Category</div>
            <ul class="cat-list" id="catList">
                <li class="cat-item active" data-cat="" onclick="selectCategory(this,'')">
                    All <span class="cat-count" id="countAll">—</span>
                </li>
            </ul>
        </div>
        <div class="filter-section">
            <div class="filter-title">Price Range</div>
            <div class="price-inputs">
                <input type="number" id="priceMin" placeholder="Min $" min="0"/>
                <input type="number" id="priceMax" placeholder="Max $" min="0"/>
            </div>
            <input type="range" class="price-slider" id="priceSlider" min="0" max="1000" value="1000" oninput="onSlider(this.value)"/>
            <button class="apply-btn" onclick="applyFilters()">Apply Filters</button>
            <button class="clear-btn" onclick="clearFilters()">Clear All</button>
        </div>
    </aside>

    <main class="main">
        <div class="toolbar">
            <div class="results-count" id="resultsCount">Loading products…</div>
            <div class="sort-wrap">
                <label>Sort by</label>
                <select class="sort-select" id="sortSelect" onchange="applyFilters()">
                    <option value="newest">Newest</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="popular">Most Popular</option>
                </select>
            </div>
        </div>
        <div class="active-filters" id="activePills"></div>
        <div id="productsContainer">
            <div class="loading-grid" id="skeletonGrid">
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
            </div>
            <div class="products-grid" id="productsGrid" style="display:none"></div>
        </div>
        <div class="pagination" id="pagination"></div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    // ===================== ORIGINAL LOGIC (fully preserved) =====================
    const BASE = 'http://localhost:8080/ecommerce/api';
    let allProducts = [], filtered = [], currentPage = 1;
    const PAGE_SIZE = 12;
    let cartItems = JSON.parse(localStorage.getItem('cart') || '[]');
    let selectedCat = '', searchTimer = null;

    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    window.addEventListener('DOMContentLoaded', () => {
        initNav();
        updateCartCount();
        fetchProducts();
    });

    window.addEventListener('scroll', () => {
        document.getElementById('mainNav').classList.toggle('scrolled', window.scrollY > 10);
    });

    document.addEventListener('click', e => {
        const menu = document.getElementById('userMenu');
        if (menu && !menu.contains(e.target)) menu.classList.remove('open');
    });

    function toggleDropdown() {
        document.getElementById('userMenu').classList.toggle('open');
    }

    function initNav() {
        if (user) {
            document.getElementById('userMenu').style.display = 'flex';
            const first = user.firstName || '';
            const last = user.lastName || '';
            document.getElementById('navName').textContent = first;
            document.getElementById('navAvatar').textContent = (first[0] || '') + (last[0] || '');
            document.getElementById('ddFullName').textContent = `${first} ${last}`.trim();
            document.getElementById('ddEmail').textContent = user.email || '';
            const role = user.role || 'CUSTOMER';
            document.getElementById('ddRole').textContent = role.charAt(0) + role.slice(1).toLowerCase();
            if (role === 'SELLER' || role === 'ADMIN') {
                document.getElementById('dashboardLink').style.display = 'flex';
            }
        } else {
            document.getElementById('guestBtns').style.display = 'flex';
        }
    }

    function handleLogout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        document.cookie = 'jwt=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
        showToast('Signed out successfully 👋');
        setTimeout(() => window.location.href = 'login.html', 900);
    }

    async function fetchProducts() {
        try {
            const res = await fetch(`${BASE}/products`);
            const data = await res.json();
            allProducts = Array.isArray(data) ? data : (data.products || []);
            allProducts = allProducts.filter(p => p.status === 'ACTIVE');
            buildCategories();
            applyFilters();
        } catch (err) {
            showEmpty('Could not load products', 'Make sure the server is running.');
        } finally {
            document.getElementById('skeletonGrid').style.display = 'none';
            document.getElementById('productsGrid').style.display = 'grid';
        }
    }

    function buildCategories() {
        const counts = {};
        allProducts.forEach(p => { const c = p.category || 'Uncategorized'; counts[c] = (counts[c] || 0) + 1; });
        document.getElementById('countAll').textContent = allProducts.length;
        const list = document.getElementById('catList');
        Object.entries(counts).sort().forEach(([cat, count]) => {
            const li = document.createElement('li');
            li.className = 'cat-item';
            li.dataset.cat = cat;
            li.onclick = () => selectCategory(li, cat);
            li.innerHTML = `${cat} <span class="cat-count">${count}</span>`;
            list.appendChild(li);
        });
    }

    function selectCategory(el, cat) {
        document.querySelectorAll('.cat-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        selectedCat = cat;
        currentPage = 1;
        applyFilters();
    }

    function onSearch() {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => { currentPage = 1; applyFilters(); }, 300);
    }

    function onSlider(val) { document.getElementById('priceMax').value = val; }

    function applyFilters() {
        const search = document.getElementById('searchInput').value.trim().toLowerCase();
        const minPrice = parseFloat(document.getElementById('priceMin').value) || 0;
        const maxPrice = parseFloat(document.getElementById('priceMax').value) || Infinity;
        const sort = document.getElementById('sortSelect').value;

        filtered = allProducts.filter(p => {
            const matchCat = !selectedCat || p.category === selectedCat;
            const matchSearch = !search || p.name.toLowerCase().includes(search) || (p.description || '').toLowerCase().includes(search);
            const price = parseFloat(p.price) || 0;
            const matchPrice = price >= minPrice && price <= maxPrice;
            return matchCat && matchSearch && matchPrice;
        });

        if (sort === 'price_asc') filtered.sort((a, b) => a.price - b.price);
        else if (sort === 'price_desc') filtered.sort((a, b) => b.price - a.price);
        else if (sort === 'newest') filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        updatePills(search, minPrice, maxPrice);
        renderPage();
        renderPagination();
        updateResultsCount();
    }

    function renderPage() {
        const grid = document.getElementById('productsGrid');
        const start = (currentPage - 1) * PAGE_SIZE;
        const page = filtered.slice(start, start + PAGE_SIZE);
        if (filtered.length === 0) {
            grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>No products found</h3><p>Try adjusting your filters or search term.</p></div>`;
            return;
        }
        grid.innerHTML = page.map((p, i) => productCard(p, i)).join('');
    }

    function productCard(p, i) {
        const price = parseFloat(p.price).toFixed(2);
        const isNew = p.createdAt && (Date.now() - new Date(p.createdAt)) / 86400000 <= 30;
        const isOut = p.status === 'OUT_OF_STOCK' || p.stockQuantity === 0;
        const lowStock = p.stockQuantity > 0 && p.stockQuantity <= 5;
        const imgHtml = p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy"/>` : `<span class="no-img">🛍️</span>`;
        const badge = isOut ? `<span class="pc-badge badge-out">Out of Stock</span>` : isNew ? `<span class="pc-badge badge-new">New</span>` : '';
        const stockText = isOut ? `<div class="pc-stock low">Out of stock</div>` : lowStock ? `<div class="pc-stock low">Only ${p.stockQuantity} left</div>` : `<div class="pc-stock">${p.stockQuantity} in stock</div>`;
        return `
            <div class="product-card" style="animation-delay:${i * 0.05}s" onclick="viewProduct(${p.id})">
                <div class="pc-img">
                    ${imgHtml}${badge}
                    <button class="pc-wishlist" onclick="toggleWishlist(event,${p.id})">🤍</button>
                </div>
                <div class="pc-body">
                    <div class="pc-category">${p.category || 'General'}</div>
                    <div class="pc-name">${escapeHtml(p.name)}</div>
                    <div class="pc-desc">${escapeHtml(p.description || '')}</div>
                    <div class="pc-footer">
                        <div><div class="pc-price">$${price}</div>${stockText}</div>
                        <button class="btn-add" ${isOut ? 'disabled' : ''} onclick="addToCart(event,${p.id},'${escapeJs(p.name)}',${p.price})">+</button>
                    </div>
                </div>
            </div>`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    function escapeJs(str) { return str.replace(/'/g, "\\'"); }

    function renderPagination() {
        const total = Math.ceil(filtered.length / PAGE_SIZE);
        const el = document.getElementById('pagination');
        if (total <= 1) { el.innerHTML = ''; return; }
        let html = `<button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>‹</button>`;
        for (let i = 1; i <= total; i++) {
            if (i === 1 || i === total || Math.abs(i - currentPage) <= 1) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
            } else if (Math.abs(i - currentPage) === 2) {
                html += `<span style="color:var(--muted);padding:0 4px">…</span>`;
            }
        }
        html += `<button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === total ? 'disabled' : ''}>›</button>`;
        el.innerHTML = html;
    }

    function goPage(n) {
        const total = Math.ceil(filtered.length / PAGE_SIZE);
        if (n < 1 || n > total) return;
        currentPage = n;
        renderPage();
        renderPagination();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updatePills(search, min, max) {
        const el = document.getElementById('activePills');
        let html = '';
        if (selectedCat) html += `<div class="filter-pill">Category: ${selectedCat}<span class="pill-remove" onclick="selectCategory(document.querySelector('.cat-item[data-cat=\\\"\\\"]'),'')">✕</span></div>`;
        if (search) html += `<div class="filter-pill">Search: "${search}"<span class="pill-remove" onclick="document.getElementById('searchInput').value='';applyFilters()">✕</span></div>`;
        if (min > 0 || max < Infinity) html += `<div class="filter-pill">Price: $${min}–${max < Infinity ? max : '∞'}<span class="pill-remove" onclick="clearPrice()">✕</span></div>`;
        el.innerHTML = html;
    }

    function clearPrice() {
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('priceSlider').value = 1000;
        applyFilters();
    }

    function clearFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('priceMin').value = '';
        document.getElementById('priceMax').value = '';
        document.getElementById('priceSlider').value = 1000;
        selectCategory(document.querySelector('.cat-item[data-cat=""]'), '');
    }

    function updateResultsCount() {
        const el = document.getElementById('resultsCount');
        const start = (currentPage - 1) * PAGE_SIZE + 1;
        const end = Math.min(currentPage * PAGE_SIZE, filtered.length);
        el.innerHTML = filtered.length === 0 ? 'No products found' : `Showing <strong>${start}–${end}</strong> of <strong>${filtered.length}</strong> products`;
    }

    function addToCart(e, id, name, price) {
        e.stopPropagation();
        const existing = cartItems.find(i => i.id === id);
        if (existing) existing.qty++;
        else cartItems.push({ id, name, price: parseFloat(price), qty: 1 });
        localStorage.setItem('cart', JSON.stringify(cartItems));
        updateCartCount();
        showToast(`"${name}" added to cart 🛒`);
    }

    function updateCartCount() {
        const total = cartItems.reduce((s, i) => s + i.qty, 0);
        const el = document.getElementById('cartCount');
        el.textContent = total;
        el.classList.add('bump');
        setTimeout(() => el.classList.remove('bump'), 300);
    }

    function goToCart() { window.location.href = 'cart.html'; }

    function toggleWishlist(e, id) {
        e.stopPropagation();
        const btn = e.currentTarget;
        const liked = btn.classList.toggle('liked');
        btn.textContent = liked ? '❤️' : '🤍';
        showToast(liked ? 'Added to wishlist ❤️' : 'Removed from wishlist');
    }

    function viewProduct(id) { window.location.href = `product.html?id=${id}`; }

    function showEmpty(title, msg) {
        document.getElementById('skeletonGrid').style.display = 'none';
        document.getElementById('productsGrid').style.display = 'grid';
        document.getElementById('productsGrid').innerHTML = `<div class="empty-state"><div class="icon">😕</div><h3>${title}</h3><p>${msg}</p></div>`;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
