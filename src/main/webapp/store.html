<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Store — ShopEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#f8f5f0;--bg2:#f0ebe2;--dark:#111009;--panel:#1a1810;
            --accent:#b8975a;--accent2:#d4b07a;--text:#1a1810;--muted:#8a8278;
            --border:#e0d8cc;--white:#ffffff;--sidebar-w:260px;
            --nav-h:64px;
        }
        html{scroll-behavior:smooth}
        body{background:var(--bg);font-family:'Outfit',sans-serif;color:var(--text);min-height:100vh}
        a{text-decoration:none;color:inherit}

        /* ── NAV ── */
        nav{
            position:sticky;top:0;z-index:200;
            display:flex;align-items:center;justify-content:space-between;
            padding:0 3rem;height:var(--nav-h);
            background:rgba(248,245,240,0.97);
            backdrop-filter:blur(16px);
            border-bottom:1px solid var(--border);
            transition:box-shadow .3s;
        }
        nav.scrolled{box-shadow:0 4px 24px rgba(0,0,0,0.08)}

        .nav-brand{
            font-family:'Cormorant Garamond',serif;
            font-size:1.5rem;font-weight:600;color:var(--dark);
            letter-spacing:.01em;
        }
        .nav-brand span{color:var(--accent)}

        .nav-center{
            display:flex;gap:2rem;
            position:absolute;left:50%;transform:translateX(-50%);
        }
        .nav-link{
            font-size:.88rem;font-weight:400;color:var(--muted);
            padding:.25rem 0;border-bottom:2px solid transparent;
            transition:color .2s,border-color .2s;
        }
        .nav-link:hover,.nav-link.active{color:var(--dark);border-color:var(--accent)}

        .nav-right{display:flex;align-items:center;gap:.75rem}

        /* Cart */
        .cart-btn{
            position:relative;width:38px;height:38px;border-radius:50%;
            border:1px solid var(--border);background:var(--white);
            display:flex;align-items:center;justify-content:center;
            font-size:1rem;cursor:pointer;transition:border-color .2s,transform .2s;
        }
        .cart-btn:hover{border-color:var(--accent);transform:scale(1.05)}
        .cart-count{
            position:absolute;top:-4px;right:-4px;
            width:18px;height:18px;background:var(--accent);color:var(--white);
            border-radius:50%;font-size:.62rem;font-weight:600;
            display:flex;align-items:center;justify-content:center;
            transition:transform .3s cubic-bezier(.34,1.56,.64,1);
        }
        .cart-count.bump{transform:scale(1.4)}

        /* User dropdown */
        .user-menu{position:relative}
        .user-trigger{
            display:flex;align-items:center;gap:.5rem;
            padding:.35rem .75rem .35rem .35rem;
            border:1px solid var(--border);border-radius:100px;
            background:var(--white);cursor:pointer;
            transition:border-color .2s,background .2s;
        }
        .user-trigger:hover{border-color:var(--accent);background:var(--bg)}
        .nav-avatar{
            width:28px;height:28px;border-radius:50%;
            background:linear-gradient(135deg,var(--accent),var(--accent2));
            display:flex;align-items:center;justify-content:center;
            font-size:.72rem;font-weight:600;color:var(--white);flex-shrink:0;
        }
        .user-trigger .name{font-size:.85rem;font-weight:500;color:var(--text)}
        .chevron{
            font-size:.65rem;color:var(--muted);
            transition:transform .25s;display:inline-block;
        }
        .user-menu.open .chevron{transform:rotate(180deg)}

        .dropdown{
            position:absolute;top:calc(100% + 10px);right:0;min-width:210px;
            background:var(--white);border:1px solid var(--border);
            border-radius:14px;padding:.5rem;
            box-shadow:0 12px 40px rgba(0,0,0,0.12);
            opacity:0;transform:translateY(-8px) scale(.97);
            pointer-events:none;
            transition:opacity .22s ease,transform .22s ease;
        }
        .user-menu.open .dropdown{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}

        .dd-header{padding:.6rem .85rem .5rem;border-bottom:1px solid var(--border);margin-bottom:.35rem}
        .dd-name{font-size:.9rem;font-weight:500;color:var(--text)}
        .dd-email{font-size:.77rem;color:var(--muted);margin-top:2px}
        .dd-role{
            display:inline-block;margin-top:5px;
            font-size:.68rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
            padding:.2rem .55rem;border-radius:100px;
            background:#f0ebe2;color:var(--accent);
        }

        .dd-item{
            display:flex;align-items:center;gap:.6rem;
            padding:.55rem .85rem;border-radius:9px;
            font-size:.87rem;color:var(--text);cursor:pointer;
            transition:background .15s;
        }
        .dd-item:hover{background:var(--bg)}
        .dd-item .icon{font-size:1rem;color:var(--muted)}
        .dd-sep{height:1px;background:var(--border);margin:.35rem 0}
        .dd-item.logout{color:#c0392b}
        .dd-item.logout .icon{color:#c0392b}

        /* Auth buttons for guests */
        .btn-sm{
            padding:.45rem 1.1rem;border-radius:100px;
            font-family:'Outfit',sans-serif;font-size:.83rem;font-weight:500;
            cursor:pointer;transition:all .2s;border:none;
        }
        .btn-outline{border:1px solid var(--border)!important;background:transparent;color:var(--text)}
        .btn-outline:hover{border-color:var(--accent)!important;color:var(--accent)}
        .btn-dark{background:var(--dark);color:var(--white)}
        .btn-dark:hover{background:var(--panel)}

        /* ── LAYOUT ── */
        .page{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:calc(100vh - var(--nav-h))}

        /* ── SIDEBAR ── */
        .sidebar{
            border-right:1px solid var(--border);padding:2rem 1.5rem;
            background:var(--white);position:sticky;
            top:var(--nav-h);height:calc(100vh - var(--nav-h));overflow-y:auto;
        }
        .filter-section{margin-bottom:2rem}
        .filter-title{
            font-size:.72rem;font-weight:600;letter-spacing:.12em;
            text-transform:uppercase;color:var(--muted);
            margin-bottom:1rem;padding-bottom:.6rem;border-bottom:1px solid var(--border);
        }
        .search-wrap{position:relative;margin-bottom:.5rem}
        .search-wrap input{
            width:100%;padding:.7rem 1rem .7rem 2.4rem;
            border:1px solid var(--border);border-radius:8px;
            background:var(--bg);font-family:'Outfit',sans-serif;
            font-size:.88rem;color:var(--text);outline:none;transition:border-color .2s;
        }
        .search-wrap input:focus{border-color:var(--accent)}
        .search-wrap input::placeholder{color:#bbb}
        .search-icon{
            position:absolute;left:.8rem;top:50%;transform:translateY(-50%);
            color:var(--muted);font-size:.9rem;pointer-events:none;
        }
        .cat-list{list-style:none}
        .cat-item{
            display:flex;align-items:center;justify-content:space-between;
            padding:.5rem .6rem;border-radius:8px;cursor:pointer;
            font-size:.9rem;transition:background .15s,color .15s;margin-bottom:2px;
        }
        .cat-item:hover{background:var(--bg2)}
        .cat-item.active{background:var(--dark);color:var(--white)}
        .cat-item.active .cat-count{background:rgba(255,255,255,.2);color:var(--white)}
        .cat-count{font-size:.72rem;background:var(--bg2);color:var(--muted);padding:.15rem .5rem;border-radius:100px}
        .price-inputs{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:.8rem}
        .price-inputs input{
            width:100%;padding:.6rem .7rem;border:1px solid var(--border);
            border-radius:8px;background:var(--bg);font-family:'Outfit',sans-serif;
            font-size:.85rem;color:var(--text);outline:none;transition:border-color .2s;
        }
        .price-inputs input:focus{border-color:var(--accent)}
        .price-slider{width:100%;accent-color:var(--accent);cursor:pointer}
        .apply-btn{
            width:100%;padding:.65rem;background:var(--dark);color:var(--white);
            border:none;border-radius:8px;font-family:'Outfit',sans-serif;
            font-size:.85rem;font-weight:500;cursor:pointer;margin-top:.8rem;transition:background .2s;
        }
        .apply-btn:hover{background:var(--panel)}
        .clear-btn{
            width:100%;padding:.55rem;background:transparent;color:var(--muted);
            border:1px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;
            font-size:.82rem;cursor:pointer;margin-top:.5rem;transition:all .2s;
        }
        .clear-btn:hover{border-color:var(--accent);color:var(--accent)}

        /* ── MAIN ── */
        .main{padding:2rem}
        .toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.8rem;flex-wrap:wrap;gap:1rem}
        .results-count{font-size:.88rem;color:var(--muted)}
        .results-count strong{color:var(--text)}
        .sort-wrap{display:flex;align-items:center;gap:.6rem}
        .sort-wrap label{font-size:.82rem;color:var(--muted)}
        .sort-select{
            padding:.5rem 1rem;border:1px solid var(--border);border-radius:8px;
            background:var(--white);font-family:'Outfit',sans-serif;
            font-size:.85rem;color:var(--text);outline:none;cursor:pointer;transition:border-color .2s;
        }
        .sort-select:focus{border-color:var(--accent)}

        .active-filters{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.5rem}
        .filter-pill{
            display:flex;align-items:center;gap:.4rem;padding:.3rem .8rem;
            background:var(--dark);color:var(--white);border-radius:100px;font-size:.78rem;font-weight:500;
        }
        .pill-remove{cursor:pointer;opacity:.7;transition:opacity .2s;font-size:.9rem;line-height:1}
        .pill-remove:hover{opacity:1}

        /* ── GRID ── */
        .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem}

        .product-card{
            background:var(--white);border-radius:16px;overflow:hidden;
            cursor:pointer;position:relative;
            transition:transform .35s cubic-bezier(.34,1.4,.64,1),box-shadow .35s;
            animation:cardIn .4s ease both;
        }
        @keyframes cardIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
        .product-card:hover{transform:translateY(-8px);box-shadow:0 28px 60px rgba(0,0,0,0.12)}

        .pc-img{
            width:100%;aspect-ratio:3/4;background:var(--bg2);
            display:flex;align-items:center;justify-content:center;
            position:relative;overflow:hidden;
        }
        .pc-img img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
        .product-card:hover .pc-img img{transform:scale(1.07)}
        .pc-img .no-img{font-size:4rem;color:var(--border)}
        .pc-badge{
            position:absolute;top:.8rem;left:.8rem;
            padding:.25rem .6rem;border-radius:100px;
            font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
        }
        .badge-new{background:var(--dark);color:var(--white)}
        .badge-out{background:#e07070;color:var(--white)}
        .pc-wishlist{
            position:absolute;top:.8rem;right:.8rem;
            width:32px;height:32px;border-radius:50%;
            background:var(--white);border:none;
            display:flex;align-items:center;justify-content:center;
            font-size:.9rem;cursor:pointer;opacity:0;
            transition:opacity .2s,transform .2s;box-shadow:0 2px 8px rgba(0,0,0,.1);
        }
        .product-card:hover .pc-wishlist{opacity:1}
        .pc-wishlist:hover{transform:scale(1.15)}
        .pc-wishlist.liked{opacity:1;color:#e07070}

        .pc-body{padding:1rem 1.2rem 1.2rem}
        .pc-category{font-size:.72rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:.3rem}
        .pc-name{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:var(--dark);margin-bottom:.3rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .pc-desc{font-size:.8rem;color:var(--muted);font-weight:300;margin-bottom:.8rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .pc-footer{display:flex;align-items:center;justify-content:space-between}
        .pc-price{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:600;color:var(--dark)}
        .pc-stock{font-size:.75rem;color:var(--muted);margin-top:.2rem}
        .pc-stock.low{color:#e07070}
        .btn-add{
            width:36px;height:36px;border-radius:50%;background:var(--dark);border:none;
            color:var(--white);font-size:1.2rem;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
            transition:background .2s,transform .2s;flex-shrink:0;
        }
        .btn-add:hover{background:var(--accent);transform:scale(1.12)}
        .btn-add:disabled{background:var(--border);cursor:not-allowed;transform:none}

        /* skeleton */
        .loading-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem}
        .skeleton{background:var(--white);border-radius:16px;overflow:hidden;animation:pulse 1.5s ease infinite}
        .skeleton-img{width:100%;aspect-ratio:3/4;background:var(--bg2)}
        .skeleton-body{padding:1rem 1.2rem 1.2rem}
        .skeleton-line{height:12px;background:var(--bg2);border-radius:6px;margin-bottom:.6rem}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

        .empty-state{grid-column:1/-1;text-align:center;padding:5rem 2rem}
        .empty-state .icon{font-size:3rem;margin-bottom:1rem}
        .empty-state h3{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:400;margin-bottom:.5rem}
        .empty-state p{color:var(--muted);font-size:.9rem}

        /* pagination */
        .pagination{display:flex;align-items:center;justify-content:center;gap:.5rem;margin-top:3rem;padding-bottom:2rem}
        .page-btn{
            width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
            background:var(--white);font-family:'Outfit',sans-serif;font-size:.85rem;
            color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;
        }
        .page-btn:hover{border-color:var(--accent);color:var(--accent)}
        .page-btn.active{background:var(--dark);border-color:var(--dark);color:var(--white)}
        .page-btn:disabled{opacity:.4;cursor:not-allowed}

        /* toast */
        .toast{
            position:fixed;bottom:2rem;right:2rem;
            background:var(--dark);color:var(--white);
            padding:.8rem 1.4rem;border-radius:12px;font-size:.88rem;font-weight:500;
            z-index:999;transform:translateY(80px);opacity:0;
            transition:all .35s cubic-bezier(.34,1.4,.64,1);
            box-shadow:0 8px 30px rgba(0,0,0,.2);
        }
        .toast.show{transform:translateY(0);opacity:1}

        /* seller badge in nav */
        .seller-badge{
            font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
            padding:.25rem .65rem;border-radius:100px;
            background:#f0ebe2;color:var(--accent);border:1px solid #e0d0b0;
        }

        @media(max-width:900px){
            .page{grid-template-columns:1fr}
            .sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--border)}
            nav{padding:0 1.5rem}
            .main{padding:1.5rem}
            .nav-center{display:none}
        }
    </style>
</head>
<body>

<nav id="mainNav">
    <a href="index.html" class="nav-brand">Shop<span>Ease</span></a>

    <div class="nav-center">
        <a href="store.html" class="nav-link active">Store</a>
        <a href="#" class="nav-link">New Arrivals</a>
        <a href="#" class="nav-link">Deals</a>
        <a href="#" class="nav-link">About</a>
    </div>

    <div class="nav-right">

        <!-- Logged-in user menu -->
        <div class="user-menu" id="userMenu" style="display:none">
            <div class="user-trigger" onclick="toggleDropdown()">
                <div class="nav-avatar" id="navAvatar">JD</div>
                <span class="name" id="navName">John</span>
                <span class="chevron">▼</span>
            </div>
            <div class="dropdown" id="dropdown">
                <div class="dd-header">
                    <div class="dd-name" id="ddFullName">John Doe</div>
                    <div class="dd-email" id="ddEmail">john@example.com</div>
                    <span class="dd-role" id="ddRole">Customer</span>
                </div>
                <div class="dd-item" onclick="window.location.href='profile.html'">
                    <span class="icon">👤</span> My Profile
                </div>
                <div class="dd-item" onclick="window.location.href='orders.html'">
                    <span class="icon">📦</span> My Orders
                </div>
                <div class="dd-item" id="dashboardLink" style="display:none" onclick="window.location.href='dashboard.html'">
                    <span class="icon">⚙️</span> Seller Dashboard
                </div>
                <div class="dd-sep"></div>
                <div class="dd-item logout" onclick="handleLogout()">
                    <span class="icon">🚪</span> Sign Out
                </div>
            </div>
        </div>

        <!-- Guest buttons -->
        <div id="guestBtns" style="display:none;gap:.5rem;align-items:center">
            <a href="login.html"><button class="btn-sm btn-outline">Sign In</button></a>
            <a href="signup.html"><button class="btn-sm btn-dark">Sign Up</button></a>
        </div>

        <button class="cart-btn" onclick="goToCart()">
            🛒<span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</nav>

<div class="page">
    <aside class="sidebar">
        <div class="filter-section">
            <div class="filter-title">Search</div>
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Search products…" oninput="onSearch()"/>
            </div>
        </div>
        <div class="filter-section">
            <div class="filter-title">Category</div>
            <ul class="cat-list" id="catList">
                <li class="cat-item active" data-cat="" onclick="selectCategory(this,'')">
                    All <span class="cat-count" id="countAll">—</span>
                </li>
            </ul>
        </div>
        <div class="filter-section">
            <div class="filter-title">Price Range</div>
            <div class="price-inputs">
                <input type="number" id="priceMin" placeholder="Min $" min="0"/>
                <input type="number" id="priceMax" placeholder="Max $" min="0"/>
            </div>
            <input type="range" class="price-slider" id="priceSlider" min="0" max="1000" value="1000" oninput="onSlider(this.value)"/>
            <button class="apply-btn" onclick="applyFilters()">Apply Filters</button>
            <button class="clear-btn" onclick="clearFilters()">Clear All</button>
        </div>
    </aside>

    <main class="main">
        <div class="toolbar">
            <div class="results-count" id="resultsCount">Loading products…</div>
            <div class="sort-wrap">
                <label>Sort by</label>
                <select class="sort-select" id="sortSelect" onchange="applyFilters()">
                    <option value="newest">Newest</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="popular">Most Popular</option>
                </select>
            </div>
        </div>
        <div class="active-filters" id="activePills"></div>
        <div id="productsContainer">
            <div class="loading-grid" id="skeletonGrid">
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
                <div class="skeleton"><div class="skeleton-img"></div><div class="skeleton-body"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:55%"></div></div></div>
            </div>
            <div class="products-grid" id="productsGrid" style="display:none"></div>
        </div>
        <div class="pagination" id="pagination"></div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script>
    const BASE='http://localhost:8080/ecommerce/api';
    let allProducts=[],filtered=[],currentPage=1;
    const PAGE_SIZE=12;
    let cartItems=JSON.parse(localStorage.getItem('cart')||'[]');
    let selectedCat='',searchTimer=null;

    const token=localStorage.getItem('token');
    const user=JSON.parse(localStorage.getItem('user')||'null');

    window.addEventListener('DOMContentLoaded',()=>{
        initNav();
        updateCartCount();
        fetchProducts();
    });

    // Sticky nav shadow on scroll
    window.addEventListener('scroll',()=>{
        document.getElementById('mainNav').classList.toggle('scrolled',window.scrollY>10);
    });

    // Close dropdown when clicking outside
    document.addEventListener('click',e=>{
        const menu=document.getElementById('userMenu');
        if(menu&&!menu.contains(e.target)) menu.classList.remove('open');
    });

    function toggleDropdown(){
        document.getElementById('userMenu').classList.toggle('open');
    }

    function initNav(){
        if(user){
            document.getElementById('userMenu').style.display='flex';
            const first=user.firstName||'';
            const last=user.lastName||'';
            document.getElementById('navName').textContent=first;
            document.getElementById('navAvatar').textContent=(first[0]||'')+(last[0]||'');
            document.getElementById('ddFullName').textContent=`${first} ${last}`.trim();
            document.getElementById('ddEmail').textContent=user.email||'';
            const role=user.role||'CUSTOMER';
            document.getElementById('ddRole').textContent=role.charAt(0)+role.slice(1).toLowerCase();
            if(role==='SELLER'||role==='ADMIN'){
                document.getElementById('dashboardLink').style.display='flex';
            }
        } else {
            const g=document.getElementById('guestBtns');
            g.style.display='flex';
        }
    }

    function handleLogout(){
        // Clear all stored data
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        // Clear jwt cookie too (in case it was set)
        document.cookie='jwt=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
        showToast('Signed out successfully 👋');
        setTimeout(()=>window.location.href='login.html',900);
    }

    async function fetchProducts(){
        try{
            const res=await fetch(`${BASE}/products`);
            const data=await res.json();
            allProducts=Array.isArray(data)?data:(data.products||[]);
            allProducts=allProducts.filter(p=>p.status==='ACTIVE');
            buildCategories();
            applyFilters();
        }catch(err){
            showEmpty('Could not load products','Make sure the server is running.');
        }finally{
            document.getElementById('skeletonGrid').style.display='none';
            document.getElementById('productsGrid').style.display='grid';
        }
    }

    function buildCategories(){
        const counts={};
        allProducts.forEach(p=>{const c=p.category||'Uncategorized';counts[c]=(counts[c]||0)+1;});
        document.getElementById('countAll').textContent=allProducts.length;
        const list=document.getElementById('catList');
        Object.entries(counts).sort().forEach(([cat,count])=>{
            const li=document.createElement('li');
            li.className='cat-item';li.dataset.cat=cat;
            li.onclick=()=>selectCategory(li,cat);
            li.innerHTML=`${cat} <span class="cat-count">${count}</span>`;
            list.appendChild(li);
        });
    }

    function selectCategory(el,cat){
        document.querySelectorAll('.cat-item').forEach(i=>i.classList.remove('active'));
        el.classList.add('active');
        selectedCat=cat;currentPage=1;applyFilters();
    }

    function onSearch(){
        clearTimeout(searchTimer);
        searchTimer=setTimeout(()=>{currentPage=1;applyFilters();},300);
    }

    function onSlider(val){document.getElementById('priceMax').value=val;}

    function applyFilters(){
        const search=document.getElementById('searchInput').value.trim().toLowerCase();
        const minPrice=parseFloat(document.getElementById('priceMin').value)||0;
        const maxPrice=parseFloat(document.getElementById('priceMax').value)||Infinity;
        const sort=document.getElementById('sortSelect').value;

        filtered=allProducts.filter(p=>{
            const matchCat=!selectedCat||p.category===selectedCat;
            const matchSearch=!search||p.name.toLowerCase().includes(search)||(p.description||'').toLowerCase().includes(search);
            const price=parseFloat(p.price)||0;
            const matchPrice=price>=minPrice&&price<=maxPrice;
            return matchCat&&matchSearch&&matchPrice;
        });

        filtered.sort((a,b)=>{
            if(sort==='price_asc') return a.price-b.price;
            if(sort==='price_desc') return b.price-a.price;
            if(sort==='newest') return new Date(b.createdAt)-new Date(a.createdAt);
            return 0;
        });

        updatePills(search,minPrice,maxPrice);
        renderPage();renderPagination();updateResultsCount();
    }

    function renderPage(){
        const grid=document.getElementById('productsGrid');
        const start=(currentPage-1)*PAGE_SIZE;
        const page=filtered.slice(start,start+PAGE_SIZE);
        if(filtered.length===0){
            grid.innerHTML=`<div class="empty-state"><div class="icon">🔍</div><h3>No products found</h3><p>Try adjusting your filters or search term.</p></div>`;
            return;
        }
        grid.innerHTML=page.map((p,i)=>productCard(p,i)).join('');
    }

    function productCard(p,i){
        const price=parseFloat(p.price).toFixed(2);
        const isNew=isNewProduct(p.createdAt);
        const isOut=p.status==='OUT_OF_STOCK'||p.stockQuantity===0;
        const lowStock=p.stockQuantity>0&&p.stockQuantity<=5;
        const imgHtml=p.imageUrl?`<img src="${p.imageUrl}" alt="${p.name}" loading="lazy"/>`:`<span class="no-img">🛍️</span>`;
        const badge=isOut?`<span class="pc-badge badge-out">Out of Stock</span>`:isNew?`<span class="pc-badge badge-new">New</span>`:'';
        const stockText=isOut?`<div class="pc-stock low">Out of stock</div>`:lowStock?`<div class="pc-stock low">Only ${p.stockQuantity} left</div>`:`<div class="pc-stock">${p.stockQuantity} in stock</div>`;
        return `
  <div class="product-card" style="animation-delay:${i*0.05}s" onclick="viewProduct(${p.id})">
    <div class="pc-img">
      ${imgHtml}${badge}
      <button class="pc-wishlist" onclick="toggleWishlist(event,${p.id})">🤍</button>
    </div>
    <div class="pc-body">
      <div class="pc-category">${p.category||'General'}</div>
      <div class="pc-name">${p.name}</div>
      <div class="pc-desc">${p.description||''}</div>
      <div class="pc-footer">
        <div>
          <div class="pc-price">$${price}</div>
          ${stockText}
        </div>
        <button class="btn-add" ${isOut?'disabled':''} onclick="addToCart(event,${p.id},'${p.name.replace(/'/g,"\\'")}',${p.price})">+</button>
      </div>
    </div>
  </div>`;
    }

    function renderPagination(){
        const total=Math.ceil(filtered.length/PAGE_SIZE);
        const el=document.getElementById('pagination');
        if(total<=1){el.innerHTML='';return;}
        let html=`<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
        for(let i=1;i<=total;i++){
            if(i===1||i===total||Math.abs(i-currentPage)<=1){
                html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
            }else if(Math.abs(i-currentPage)===2){
                html+=`<span style="color:var(--muted);padding:0 4px">…</span>`;
            }
        }
        html+=`<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>`;
        el.innerHTML=html;
    }

    function goPage(n){
        const total=Math.ceil(filtered.length/PAGE_SIZE);
        if(n<1||n>total)return;
        currentPage=n;renderPage();renderPagination();
        window.scrollTo({top:0,behavior:'smooth'});
    }

    function updatePills(search,min,max){
        const el=document.getElementById('activePills');
        let html='';
        if(selectedCat) html+=pill(`Category: ${selectedCat}`,`selectCategory(document.querySelector('.cat-item[data-cat=""]'),'')`);
        if(search) html+=pill(`Search: "${search}"`,`document.getElementById('searchInput').value='';applyFilters()`);
        if(min>0||max<Infinity) html+=pill(`Price: $${min}–${max<Infinity?max:'∞'}`,`clearPrice()`);
        el.innerHTML=html;
    }

    function pill(label,action){
        return `<div class="filter-pill">${label}<span class="pill-remove" onclick="${action}">✕</span></div>`;
    }

    function clearPrice(){
        document.getElementById('priceMin').value='';
        document.getElementById('priceMax').value='';
        document.getElementById('priceSlider').value=1000;
        applyFilters();
    }

    function clearFilters(){
        document.getElementById('searchInput').value='';
        document.getElementById('priceMin').value='';
        document.getElementById('priceMax').value='';
        document.getElementById('priceSlider').value=1000;
        selectCategory(document.querySelector('.cat-item[data-cat=""]'),'');
    }

    function updateResultsCount(){
        const el=document.getElementById('resultsCount');
        const start=(currentPage-1)*PAGE_SIZE+1;
        const end=Math.min(currentPage*PAGE_SIZE,filtered.length);
        el.innerHTML=filtered.length===0?'No products found':`Showing <strong>${start}–${end}</strong> of <strong>${filtered.length}</strong> products`;
    }

    function addToCart(e,id,name,price){
        e.stopPropagation();
        const existing=cartItems.find(i=>i.id===id);
        if(existing) existing.qty++;
        else cartItems.push({id,name,price:parseFloat(price),qty:1});
        localStorage.setItem('cart',JSON.stringify(cartItems));
        updateCartCount();
        showToast(`"${name}" added to cart 🛒`);
    }

    function updateCartCount(){
        const total=cartItems.reduce((sum,i)=>sum+i.qty,0);
        const el=document.getElementById('cartCount');
        el.textContent=total;
        el.classList.add('bump');
        setTimeout(()=>el.classList.remove('bump'),300);
    }

    function goToCart(){window.location.href='cart.html'}

    function toggleWishlist(e,id){
        e.stopPropagation();
        const btn=e.currentTarget;
        const liked=btn.classList.toggle('liked');
        btn.textContent=liked?'❤️':'🤍';
        showToast(liked?'Added to wishlist ❤️':'Removed from wishlist');
    }

    function viewProduct(id){window.location.href=`product.html?id=${id}`}

    function isNewProduct(dateStr){
        if(!dateStr)return false;
        return(Date.now()-new Date(dateStr))/(1000*60*60*24)<=30;
    }

    function showEmpty(title,msg){
        document.getElementById('skeletonGrid').style.display='none';
        document.getElementById('productsGrid').style.display='grid';
        document.getElementById('productsGrid').innerHTML=`<div class="empty-state"><div class="icon">😕</div><h3>${title}</h3><p>${msg}</p></div>`;
        document.getElementById('resultsCount').textContent='';
    }

    function showToast(msg){
        const t=document.getElementById('toast');
        t.textContent=msg;t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),2500);
    }
</script>
</body>
</html>
