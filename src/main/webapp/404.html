<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Page Not Found — ShopEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0d0d0d;
            --panel:   #141414;
            --panel2:  #1a1a1a;
            --border:  #2a2a2a;
            --accent:  #c8a96e;
            --accent2: #e8c98e;
            --text:    #f0ede8;
            --muted:   #7a7470;
            --warning: #e0b870;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 2.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--accent);
            text-decoration: none;
        }
        .brand span { color: var(--text); }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 2rem;
            text-align: center;
        }

        .error-illustration {
            font-size: 4.5rem;
            margin-bottom: 1.5rem;
        }

        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 7rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .error-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--text);
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1rem;
            color: var(--muted);
            max-width: 420px;
            line-height: 1.7;
        }

        .url-display {
            margin: 1.2rem auto;
            padding: 0.5rem 1.2rem;
            background: var(--panel2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.83rem;
            color: var(--warning);
            font-family: monospace;
            max-width: 380px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .divider {
            width: 40px;
            height: 1px;
            background: var(--border);
            margin: 2rem auto;
        }

        .suggestions-title {
            font-size: 0.8rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .suggestions {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .suggestion-link {
            padding: 0.55rem 1.2rem;
            border-radius: 8px;
            font-size: 0.875rem;
            text-decoration: none;
            color: var(--muted);
            border: 1px solid var(--border);
            background: var(--panel);
            transition: all 0.2s;
        }
        .suggestion-link:hover {
            color: var(--text);
            border-color: var(--accent);
            color: var(--accent);
        }

        .actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 0.65rem 1.6rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid var(--border);
        }

        .btn-primary {
            background: var(--accent);
            color: #0d0d0d;
            border-color: var(--accent);
        }
        .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }

        .btn-ghost {
            background: transparent;
            color: var(--muted);
        }
        .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
    </style>
</head>
<body>

<nav>
    <a class="brand" href="index.html">Shop<span>Ease</span></a>
</nav>

<main class="main">
    <div class="error-illustration">🔍</div>
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>

    <p class="error-message">
        We couldn't find the page you were looking for.
        It might have been moved, deleted, or never existed.
    </p>

    <div class="url-display" id="badUrl"></div>

    <div class="divider"></div>

    <p class="suggestions-title">Maybe you were looking for</p>

    <div class="suggestions">
        <a href="index.html"    class="suggestion-link">🏠 Home</a>
        <a href="store.html"    class="suggestion-link">🛍️ Store</a>
        <a href="login.html"    class="suggestion-link">🔑 Login</a>
        <a href="signup.html"   class="suggestion-link">✨ Sign Up</a>
        <a href="products.html" class="suggestion-link" id="mgmtLink" style="display:none">📦 Product Mgmt</a>
    </div>

    <div class="actions">
        <a href="index.html" class="btn btn-primary">Go Home</a>
        <a href="javascript:history.back()" class="btn btn-ghost">← Go Back</a>
    </div>
</main>

<script>
    // Display the bad URL — strip the app context prefix (e.g. /ecommerce)
    const contextPath = '/ecommerce';
    const rawPath = window.location.pathname;
    const displayPath = rawPath.startsWith(contextPath)
        ? rawPath.slice(contextPath.length) || '/'
        : rawPath;
    document.getElementById('badUrl').textContent = displayPath;

    // Show product management link only for ADMIN or SELLER
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    if (user.role === 'ADMIN' || user.role === 'SELLER') {
        document.getElementById('mgmtLink').style.display = '';
    }
</script>

</body>
</html>
