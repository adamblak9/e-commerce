<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <script src="auth.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sign Up — ShopEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:          #eef5fc;
            --surface:     #ffffff;
            --blue-light:  #85b9e6;
            --blue-mid:    #3d8cc7;
            --blue-dark:   #1f5e96;
            --blue-deep:   #0d3a64;
            --seller:      #2e8fa3;
            --seller-l:    #7dc4d4;
            --border:      rgba(61,140,199,0.16);
            --border-md:   rgba(61,140,199,0.26);
            --text:        #0d3a64;
            --muted:       #5a84a6;
            --dim:         #adc8e0;
            --error:       #b83232;
            --success:     #177a52;
        }

        html, body { height: 100%; }

        body {
            min-height: 100vh;
            background: var(--surface);
            display: flex;
            font-family: 'Jost', sans-serif;
            color: var(--text);
        }

        /* ── LEFT ── */
        .left {
            position: sticky;
            top: 0;
            width: 42%;
            flex-shrink: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 3.5rem;
            overflow: hidden;
            transition: background 0.6s;
        }

        .left.customer {
            background: linear-gradient(150deg, #b8d8f0 0%, #cde4f7 45%, #ddeefa 100%);
        }

        .left.seller {
            background: linear-gradient(150deg, #b0dce8 0%, #c6e8f2 45%, #dcf0f6 100%);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }
        .orb-1 {
            width: 380px; height: 380px;
            top: -120px; right: -80px;
            background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, transparent 65%);
        }
        .orb-2 {
            width: 260px; height: 260px;
            bottom: 30px; left: -80px;
            background: radial-gradient(circle, rgba(61,140,199,0.1) 0%, transparent 70%);
        }

        .vert-rule {
            position: absolute;
            right: 0; top: 0; bottom: 0;
            width: 1px;
            background: linear-gradient(180deg, transparent 0%, var(--border-md) 30%, var(--border-md) 70%, transparent 100%);
        }

        .brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--blue-deep);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            z-index: 1;
            animation: fadeIn 0.8s ease both;
            transition: color 0.5s;
        }

        .left.seller .brand { color: #0c3d4a; }

        .brand-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--blue-mid);
            transition: background 0.5s;
        }

        .left.seller .brand-dot { background: var(--seller); }

        .left-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-bottom: 3rem;
            z-index: 1;
        }

        .eyebrow {
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--blue-mid);
            margin-bottom: 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            transition: color 0.4s;
            animation: fadeIn 0.7s ease both 0.1s;
        }

        .left.seller .eyebrow { color: var(--seller); }

        .eyebrow::before {
            content: '';
            display: block;
            width: 24px; height: 1.5px;
            background: currentColor;
            border-radius: 2px;
        }

        .left-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.4rem, 3.8vw, 4rem);
            font-weight: 300;
            line-height: 1.1;
            margin-bottom: 1.8rem;
            color: var(--blue-deep);
            animation: slideUp 0.8s ease both 0.15s;
        }

        .left.seller .left-title { color: #0c3d4a; }

        .left-title em {
            font-style: italic;
            color: var(--blue-mid);
            transition: color 0.5s;
        }

        .left.seller .left-title em { color: var(--seller); }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .step {
            display: flex;
            gap: 1rem;
            align-items: flex-start;
            opacity: 0;
            transform: translateX(-8px);
            animation: slideRight 0.5s ease forwards;
        }
        .step:nth-child(1) { animation-delay: 0.2s; }
        .step:nth-child(2) { animation-delay: 0.32s; }
        .step:nth-child(3) { animation-delay: 0.44s; }

        .step-num {
            width: 26px; height: 26px;
            border-radius: 50%;
            border: 1.5px solid var(--blue-mid);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--blue-mid);
            flex-shrink: 0;
            margin-top: 1px;
            background: rgba(255,255,255,0.5);
            transition: border-color 0.5s, color 0.5s;
        }

        .left.seller .step-num { border-color: var(--seller); color: var(--seller); }

        .step-info strong {
            display: block;
            font-size: 0.83rem;
            font-weight: 500;
            margin-bottom: 0.15rem;
            color: var(--blue-deep);
        }

        .left.seller .step-info strong { color: #0c3d4a; }

        .step-info p {
            font-size: 0.76rem;
            color: var(--muted);
            font-weight: 300;
            line-height: 1.5;
        }

        .left-foot {
            font-size: 0.67rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--blue-light);
            z-index: 1;
            animation: fadeIn 1s ease both 0.6s;
        }

        /* ── RIGHT ── */
        .right {
            flex: 1;
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3.5rem;
            position: relative;
            box-shadow: -4px 0 30px rgba(61,140,199,0.07);
            min-height: 100vh;
        }

        .right::before {
            content: '';
            position: absolute;
            top: 2.5rem; right: 3rem;
            width: 44px; height: 44px;
            border-top: 1.5px solid var(--border-md);
            border-right: 1.5px solid var(--border-md);
            pointer-events: none;
        }

        .form-box {
            width: 100%;
            max-width: 440px;
            padding: 2rem 0;
            animation: slideUp 0.7s ease both 0.2s;
        }

        .form-header { margin-bottom: 1.8rem; }

        .form-tag {
            font-size: 0.67rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--blue-mid);
            display: block;
            margin-bottom: 0.5rem;
        }

        .form-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 300;
            color: var(--blue-deep);
            margin-bottom: 0.4rem;
        }

        .form-header p { color: var(--muted); font-size: 0.84rem; font-weight: 300; }
        .form-header a { color: var(--blue-dark); text-decoration: none; border-bottom: 1px solid var(--dim); transition: border-color 0.2s; }
        .form-header a:hover { border-color: var(--blue-dark); }

        /* Role toggle */
        .role-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border: 1.5px solid var(--dim);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .role-btn {
            padding: 0.7rem 1rem;
            border: none;
            background: transparent;
            font-family: 'Jost', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .role-btn + .role-btn { border-left: 1.5px solid var(--dim); }

        .role-btn.active-customer {
            background: var(--blue-dark);
            color: #fff;
        }

        .role-btn.active-seller {
            background: var(--seller);
            color: #fff;
        }

        .role-info {
            font-size: 0.78rem;
            color: var(--muted);
            font-weight: 300;
            padding: 0.6rem 0.9rem;
            border-left: 2px solid var(--blue-mid);
            margin-bottom: 1.6rem;
            background: rgba(61,140,199,0.05);
            border-radius: 0 3px 3px 0;
            transition: border-color 0.4s, background 0.4s;
        }

        .role-info.seller-info {
            border-color: var(--seller);
            background: rgba(46,143,163,0.05);
        }

        .role-info strong { color: var(--blue-deep); font-weight: 500; }

        .alert {
            padding: 0.72rem 1rem;
            font-size: 0.8rem;
            margin-bottom: 1.2rem;
            display: none;
            border-left: 2px solid;
            border-radius: 0 3px 3px 0;
        }
        .alert.error   { border-color: var(--error); color: var(--error); background: rgba(184,50,50,0.05); }
        .alert.success { border-color: var(--success); color: var(--success); background: rgba(23,122,82,0.05); }
        .alert.show    { display: block; }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.4rem;
        }

        .field { margin-bottom: 1.5rem; position: relative; }

        .field label {
            display: block;
            font-size: 0.64rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.45rem;
        }

        .input-wrap { position: relative; }

        .field input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1.5px solid var(--dim);
            padding: 0.65rem 0;
            color: var(--text);
            font-family: 'Jost', sans-serif;
            font-size: 0.9rem;
            font-weight: 300;
            outline: none;
        }
        .field input::placeholder { color: var(--dim); }

        .field-line {
            position: absolute;
            bottom: 0; left: 0;
            height: 1.5px;
            width: 0;
            background: linear-gradient(90deg, var(--blue-mid), var(--blue-light));
            transition: width 0.4s cubic-bezier(0.4,0,0.2,1);
            border-radius: 2px;
        }
        .field input:focus ~ .field-line { width: 100%; }

        body.seller-mode .field-line {
            background: linear-gradient(90deg, var(--seller), var(--seller-l));
        }

        .hint { font-size: 0.68rem; color: var(--dim); margin-top: 0.35rem; }

        .btn {
            width: 100%;
            padding: 1rem;
            background: var(--blue-dark);
            border: none;
            color: #fff;
            font-family: 'Jost', sans-serif;
            font-size: 0.76rem;
            font-weight: 500;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.25s, transform 0.15s;
            margin-top: 0.5rem;
            border-radius: 4px;
        }
        .btn:hover { background: var(--blue-deep); transform: translateY(-1px); }
        .btn:active { transform: scale(0.99); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .btn.btn-seller { background: var(--seller); }
        .btn.btn-seller:hover { background: #1e6e80; }

        .tos {
            text-align: center;
            color: var(--muted);
            font-size: 0.74rem;
            margin-top: 1.1rem;
            font-weight: 300;
        }
        .tos a { color: var(--blue-dark); text-decoration: none; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideRight { to { opacity: 1; transform: translateX(0); } }

        @media (max-width: 820px) {
            body { flex-direction: column; }
            .left { display: none; }
            .right { width: 120%; min-height: 100vh; align-items: center; }
        }
    </style>
</head>
<body>

<div class="left customer" id="leftPanel">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="vert-rule"></div>

    <svg style="position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;pointer-events:none" viewBox="0 0 500 700" xmlns="http://www.w3.org/2000/svg">
        <circle cx="460" cy="640" r="170" fill="none" stroke="rgba(61,140,199,0.12)" stroke-width="1"/>
        <circle cx="460" cy="640" r="120" fill="none" stroke="rgba(61,140,199,0.09)" stroke-width="1"/>
        <circle cx="50" cy="100" r="80" fill="none" stroke="rgba(61,140,199,0.1)" stroke-width="1"/>
    </svg>

    <div class="brand">
        <span class="brand-dot"></span>
        ShopEase
    </div>

    <div class="left-body">
        <div class="eyebrow" id="leftEyebrow">New Member</div>
        <div class="left-title" id="leftTitle">Start your<br><em>journey.</em></div>
        <div class="steps" id="leftSteps"></div>
    </div>

    <div class="left-foot">Premium E-Commerce · Est. 2024</div>
</div>

<div class="right">
    <div class="form-box">
        <div class="form-header">
            <span class="form-tag">Create Account</span>
            <h2>Join ShopEase</h2>
            <p>Already a member? <a href="login.html">Sign in →</a></p>
        </div>

        <div class="role-toggle">
            <button class="role-btn active-customer" id="btnCustomer" onclick="setRole('CUSTOMER')">🛍 Customer</button>
            <button class="role-btn" id="btnSeller" onclick="setRole('SELLER')">🏪 Seller</button>
        </div>

        <div class="role-info" id="roleInfo">
            Sign up as a <strong>Customer</strong> to browse, buy, and track your orders.
        </div>

        <div class="alert error" id="errorMsg"></div>
        <div class="alert success" id="successMsg"></div>

        <div class="row">
            <div class="field">
                <label>First Name</label>
                <div class="input-wrap">
                    <input type="text" id="firstName" placeholder="John"/>
                    <div class="field-line"></div>
                </div>
            </div>
            <div class="field">
                <label>Last Name</label>
                <div class="input-wrap">
                    <input type="text" id="lastName" placeholder="Doe"/>
                    <div class="field-line"></div>
                </div>
            </div>
        </div>

        <div class="field">
            <label>Username</label>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="johndoe"/>
                <div class="field-line"></div>
            </div>
        </div>

        <div class="field">
            <label>Email Address</label>
            <div class="input-wrap">
                <input type="email" id="email" placeholder="john@example.com"/>
                <div class="field-line"></div>
            </div>
        </div>

        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="••••••••"/>
                <div class="field-line"></div>
            </div>
            <p class="hint">Minimum 8 characters</p>
        </div>

        <div class="field">
            <label>Phone <span style="color:var(--dim);font-size:0.65rem;">(optional)</span></label>
            <div class="input-wrap">
                <input type="tel" id="phone" placeholder="+212600000000"/>
                <div class="field-line"></div>
            </div>
        </div>

        <button class="btn btn-customer" id="submitBtn" onclick="handleSignup()">
            Create Customer Account
        </button>

        <p class="tos">By signing up you agree to our <a href="#">Terms of Service</a></p>
    </div>
</div>

<script>
    let currentRole = 'CUSTOMER';

    const leftData = {
        CUSTOMER: {
            eyebrow: 'New Member',
            title: 'Start your<br><em>journey.</em>',
            steps: [
                { n:1, title:'Create your account',   desc:'Fill in your details to get started in seconds.' },
                { n:2, title:'Browse our catalog',     desc:'Thousands of products at competitive prices.' },
                { n:3, title:'Fast & secure checkout', desc:'Multiple payment options and safe delivery.' },
            ]
        },
        SELLER: {
            eyebrow: 'Seller Programme',
            title: 'Start<br><em>selling.</em>',
            steps: [
                { n:1, title:'Create your seller account', desc:'Set up your profile in seconds.' },
                { n:2, title:'List your products',          desc:'Add your inventory with photos and pricing.' },
                { n:3, title:'Receive orders & get paid',   desc:'Manage orders and receive payouts easily.' },
            ]
        }
    };

    function renderLeft(role) {
        const d = leftData[role];
        document.getElementById('leftEyebrow').textContent = d.eyebrow;
        document.getElementById('leftTitle').innerHTML = d.title;
        document.getElementById('leftSteps').innerHTML = d.steps.map(s => `
      <div class="step">
        <div class="step-num">${s.n}</div>
        <div class="step-info">
          <strong>${s.title}</strong>
          <p>${s.desc}</p>
        </div>
      </div>
    `).join('');
    }

    function setRole(role) {
        currentRole = role;
        const isCustomer = role === 'CUSTOMER';
        const leftPanel = document.getElementById('leftPanel');
        const btnC = document.getElementById('btnCustomer');
        const btnS = document.getElementById('btnSeller');
        const info = document.getElementById('roleInfo');
        const btn  = document.getElementById('submitBtn');

        btnC.className = 'role-btn' + (isCustomer ? ' active-customer' : '');
        btnS.className = 'role-btn' + (!isCustomer ? ' active-seller' : '');

        leftPanel.className = 'left ' + (isCustomer ? 'customer' : 'seller');
        document.body.classList.toggle('seller-mode', !isCustomer);

        if (isCustomer) {
            info.className = 'role-info';
            info.innerHTML = 'Sign up as a <strong>Customer</strong> to browse, buy, and track your orders.';
        } else {
            info.className = 'role-info seller-info';
            info.innerHTML = 'Sign up as a <strong>Seller</strong> to list products and reach thousands of customers.';
        }

        btn.className = 'btn ' + (isCustomer ? 'btn-customer' : 'btn-seller');
        btn.textContent = isCustomer ? 'Create Customer Account' : 'Create Seller Account';

        renderLeft(role);
    }

    async function handleSignup() {
        const firstName = document.getElementById('firstName').value.trim();
        const lastName  = document.getElementById('lastName').value.trim();
        const username  = document.getElementById('username').value.trim();
        const email     = document.getElementById('email').value.trim();
        const password  = document.getElementById('password').value;
        const phone     = document.getElementById('phone').value.trim();
        const btn       = document.getElementById('submitBtn');

        document.getElementById('errorMsg').classList.remove('show');
        document.getElementById('successMsg').classList.remove('show');

        if (!firstName || !lastName || !username || !email || !password) {
            showError('Please fill in all required fields.'); return;
        }
        if (password.length < 8) { showError('Password must be at least 8 characters.'); return; }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { showError('Please enter a valid email address.'); return; }

        btn.disabled = true;
        btn.textContent = 'Creating account…';

        const body = { firstName, lastName, username, email, password, role: currentRole };
        if (phone) body.phoneNumber = phone;

        try {
            const res = await fetch('http://localhost:8080/ecommerce/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                const s = document.getElementById('successMsg');
                const dest = data.user.role === 'SELLER' ? 'seller-dashboard.html' : 'dashboard.html';
                s.textContent = `Welcome, ${data.user.firstName}! Redirecting…`;
                s.classList.add('show');
                setTimeout(() => { window.location.href = dest; }, 1300);
            } else {
                showError(data.error || 'Something went wrong. Please try again.');
            }
        } catch (err) {
            showError('Could not connect to the server. Make sure Tomcat is running.');
        } finally {
            btn.disabled = false;
            btn.textContent = currentRole === 'CUSTOMER' ? 'Create Customer Account' : 'Create Seller Account';
        }
    }

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.classList.add('show');
    }

    renderLeft('CUSTOMER');
</script>
</body>
</html>
