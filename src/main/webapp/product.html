<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Product — ShopEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #f8f5f0;
            --bg2:     #f0ebe2;
            --dark:    #111009;
            --panel:   #1a1810;
            --accent:  #b8975a;
            --accent2: #d4b07a;
            --text:    #1a1810;
            --muted:   #8a8278;
            --border:  #e0d8cc;
            --white:   #ffffff;
            --success: #4a9e6e;
            --error:   #c0504040;
        }

        html { scroll-behavior: smooth; }
        body { background: var(--bg); font-family: 'Outfit', sans-serif; color: var(--text); min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* ── Navbar ── */
        nav {
            position: sticky; top: 0; z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 3rem; height: 64px;
            background: rgba(248,245,240,0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .nav-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; }
        .nav-brand span { color: var(--accent); }
        .nav-r { display: flex; align-items: center; gap: 1rem; }
        .cart-btn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--white); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1rem; transition: border-color 0.2s; }
        .cart-btn:hover { border-color: var(--accent); }
        .cart-count { position: absolute; top: -4px; right: -4px; width: 16px; height: 16px; background: var(--accent); color: var(--white); border-radius: 50%; font-size: 0.6rem; font-weight: 600; display: flex; align-items: center; justify-content: center; }
        .nav-user { display: flex; align-items: center; gap: 0.6rem; font-size: 0.88rem; color: var(--muted); }
        .nav-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 600; color: var(--white); }

        /* ── Breadcrumb ── */
        .breadcrumb {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 1rem 3rem;
            font-size: 0.82rem; color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: var(--white);
        }
        .breadcrumb a { color: var(--muted); transition: color 0.2s; }
        .breadcrumb a:hover { color: var(--accent); }
        .breadcrumb .sep { color: var(--border); }
        .breadcrumb .current { color: var(--text); font-weight: 500; }

        /* ── Product section ── */
        .product-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem;
            gap: 4rem;
        }

        /* ── Image panel ── */
        .img-panel { position: sticky; top: 84px; align-self: start; }

        .main-img {
            width: 100%;
            aspect-ratio: 1;
            background: var(--bg2);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 8rem;
            overflow: hidden;
            position: relative;
            margin-bottom: 1rem;
        }

        .main-img img { width: 100%; height: 100%; object-fit: cover; }

        .img-badge {
            position: absolute; top: 1rem; left: 1rem;
            padding: 0.3rem 0.8rem; border-radius: 100px;
            font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
        }
        .badge-new { background: var(--dark); color: var(--white); }
        .badge-out { background: #e07070; color: var(--white); }
        .badge-low { background: #f0a030; color: var(--white); }

        .thumb-row { display: flex; gap: 0.6rem; }
        .thumb {
            width: 72px; height: 72px;
            background: var(--bg2); border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
            overflow: hidden;
        }
        .thumb.active { border-color: var(--accent); }
        .thumb img { width: 100%; height: 100%; object-fit: cover; }

        /* ── Info panel ── */
        .info-panel { padding: 0.5rem 0; }

        .product-cat {
            font-size: 0.75rem; font-weight: 500; letter-spacing: 0.12em;
            text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem;
        }

        .product-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 3vw, 2.8rem);
            font-weight: 400; line-height: 1.1;
            margin-bottom: 1.2rem;
        }

        .product-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem; font-weight: 600;
            color: var(--dark); margin-bottom: 0.5rem;
        }

        .stock-status {
            display: inline-flex; align-items: center; gap: 0.4rem;
            font-size: 0.85rem; font-weight: 500;
            margin-bottom: 1.5rem;
        }
        .stock-dot { width: 8px; height: 8px; border-radius: 50%; }
        .stock-in  { color: var(--success); }
        .stock-in  .stock-dot { background: var(--success); }
        .stock-low { color: #e07070; }
        .stock-low .stock-dot { background: #e07070; }
        .stock-out { color: var(--muted); }
        .stock-out .stock-dot { background: var(--muted); }

        .divider { height: 1px; background: var(--border); margin: 1.5rem 0; }

        .product-desc {
            font-size: 0.95rem; font-weight: 300;
            line-height: 1.9; color: var(--muted);
            margin-bottom: 2rem;
        }

        /* ── Quantity + Add to Cart ── */
        .purchase-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }

        .qty-wrap {
            display: flex; align-items: center;
            border: 1px solid var(--border); border-radius: 10px;
            overflow: hidden; background: var(--white);
        }
        .qty-btn {
            width: 40px; height: 48px;
            background: transparent; border: none;
            font-size: 1.2rem; color: var(--text);
            cursor: pointer; transition: background 0.15s;
            display: flex; align-items: center; justify-content: center;
        }
        .qty-btn:hover { background: var(--bg2); }
        .qty-btn:disabled { color: var(--border); cursor: not-allowed; }
        .qty-val {
            width: 48px; text-align: center;
            font-size: 1rem; font-weight: 500;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            line-height: 48px;
        }

        .btn-cart {
            flex: 1; padding: 0 2rem; height: 48px;
            background: var(--dark); color: var(--white);
            border: none; border-radius: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.95rem; font-weight: 500;
            cursor: pointer; letter-spacing: 0.03em;
            transition: background 0.2s, transform 0.15s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-cart:hover:not(:disabled) { background: var(--panel); transform: translateY(-1px); }
        .btn-cart:active { transform: translateY(0); }
        .btn-cart:disabled { background: var(--border); cursor: not-allowed; color: var(--muted); }

        /* ── Feedback ── */
        .add-feedback {
            padding: 0.7rem 1rem; border-radius: 10px;
            font-size: 0.88rem; font-weight: 500;
            margin-bottom: 1rem;
            display: none;
        }
        .add-feedback.success { background: rgba(74,158,110,0.1); border: 1px solid rgba(74,158,110,0.3); color: var(--success); display: block; }
        .add-feedback.error   { background: rgba(224,112,112,0.1); border: 1px solid rgba(224,112,112,0.3); color: #e07070; display: block; }

        /* ── Meta info ── */
        .meta-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 0.8rem; margin-bottom: 1.5rem;
        }
        .meta-item {
            padding: 0.8rem 1rem;
            background: var(--bg2); border-radius: 10px;
        }
        .meta-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 0.2rem; }
        .meta-value { font-size: 0.9rem; font-weight: 500; }

        /* ── Seller info ── */
        .seller-box {
            display: flex; align-items: center; gap: 0.8rem;
            padding: 0.9rem 1rem;
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--white);
        }
        .seller-avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 600; color: var(--white);
            flex-shrink: 0;
        }
        .seller-name { font-size: 0.9rem; font-weight: 500; }
        .seller-label { font-size: 0.75rem; color: var(--muted); }

        /* ── Related products ── */
        .related-section {
            max-width: 1200px; margin: 0 auto;
            padding: 0 3rem 4rem;
        }
        .section-tag { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; }
        .section-title { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; margin-bottom: 2rem; }

        .related-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
        }

        .product-card {
            background: var(--white); border-radius: 16px;
            overflow: hidden; cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 1px solid var(--border);
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 20px 50px rgba(0,0,0,0.08); }

        .pc-img {
            width: 100%; aspect-ratio: 1;
            background: var(--bg2);
            display: flex; align-items: center; justify-content: center;
            font-size: 3.5rem;
        }
        .pc-img img { width: 100%; height: 100%; object-fit: cover; }

        .pc-body { padding: 0.9rem 1rem 1rem; }
        .pc-cat { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.3rem; }
        .pc-name { font-family: 'Cormorant Garamond', serif; font-size: 1rem; margin-bottom: 0.5rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .pc-foot { display: flex; align-items: center; justify-content: space-between; }
        .pc-price { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-weight: 600; }
        .pc-add { width: 30px; height: 30px; border-radius: 50%; background: var(--dark); border: none; color: var(--white); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .pc-add:hover { background: var(--accent); }

        /* ── Skeleton ── */
        .skeleton { animation: pulse 1.5s ease infinite; }
        .skel-box { background: var(--bg2); border-radius: 12px; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

        /* ── Toast ── */
        .toast {
            position: fixed; bottom: 2rem; right: 2rem;
            background: var(--dark); color: var(--white);
            padding: 0.8rem 1.4rem; border-radius: 12px;
            font-size: 0.88rem; font-weight: 500; z-index: 999;
            transform: translateY(80px); opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* ── Error state ── */
        .error-state {
            text-align: center; padding: 8rem 2rem;
            grid-column: 1 / -1;
        }
        .error-state h2 { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 300; margin-bottom: 0.5rem; }
        .error-state p { color: var(--muted); margin-bottom: 1.5rem; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.7rem 1.5rem; background: var(--dark); color: var(--white);
            border-radius: 100px; font-size: 0.88rem; font-weight: 500;
            transition: background 0.2s;
        }
        .back-btn:hover { background: var(--panel); }

        @media (max-width: 900px) {
            .product-section { grid-template-columns: 1fr; padding: 1.5rem; gap: 2rem; }
            .img-panel { position: static; }
            .related-grid { grid-template-columns: repeat(2, 1fr); }
            .related-section { padding: 0 1.5rem 3rem; }
            nav { padding: 0 1.5rem; }
            .breadcrumb { padding: 1rem 1.5rem; }
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav>
    <a href="index.html" class="nav-brand">Shop<span>Ease</span></a>
    <div class="nav-r">
        <div class="nav-user" id="navUser" style="display:none;">
            <div class="nav-avatar" id="navAvatar"></div>
            <span id="navName"></span>
        </div>
        <button class="cart-btn" onclick="window.location.href='cart.html'">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </button>
    </div>
</nav>

<!-- Breadcrumb -->
<div class="breadcrumb" id="breadcrumb">
    <a href="index.html">Home</a>
    <span class="sep">›</span>
    <a href="store.html">Store</a>
    <span class="sep">›</span>
    <span class="current" id="breadcrumbName">Loading…</span>
</div>

<!-- Product -->
<div class="product-section" id="productSection">

    <!-- Image skeleton -->
    <div class="skeleton" id="imgSkeleton">
        <div class="skel-box" style="width:100%;aspect-ratio:1;border-radius:20px;margin-bottom:1rem;"></div>
        <div style="display:flex;gap:0.6rem;">
            <div class="skel-box" style="width:72px;height:72px;border-radius:10px;"></div>
            <div class="skel-box" style="width:72px;height:72px;border-radius:10px;"></div>
            <div class="skel-box" style="width:72px;height:72px;border-radius:10px;"></div>
        </div>
    </div>

    <!-- Info skeleton -->
    <div class="skeleton" id="infoSkeleton" style="padding:0.5rem 0;">
        <div class="skel-box" style="width:80px;height:12px;border-radius:6px;margin-bottom:0.8rem;"></div>
        <div class="skel-box" style="width:70%;height:32px;border-radius:8px;margin-bottom:0.5rem;"></div>
        <div class="skel-box" style="width:40%;height:32px;border-radius:8px;margin-bottom:1rem;"></div>
        <div class="skel-box" style="width:100%;height:80px;border-radius:8px;margin-bottom:1rem;"></div>
        <div class="skel-box" style="width:100%;height:48px;border-radius:10px;"></div>
    </div>

    <!-- Real content (hidden until loaded) -->
    <div id="imgPanel" style="display:none;">
        <div class="main-img" id="mainImg"></div>
        <div class="thumb-row" id="thumbRow"></div>
    </div>

    <div id="infoPanel" style="display:none;" class="info-panel">
        <div class="product-cat"  id="pCat"></div>
        <div class="product-name" id="pName"></div>
        <div class="product-price" id="pPrice"></div>
        <div class="stock-status" id="pStock"></div>
        <div class="divider"></div>
        <div class="product-desc" id="pDesc"></div>

        <div class="add-feedback" id="addFeedback"></div>

        <div class="purchase-row">
            <div class="qty-wrap">
                <button class="qty-btn" id="qtyMinus" onclick="changeQty(-1)">−</button>
                <div class="qty-val" id="qtyVal">1</div>
                <button class="qty-btn" id="qtyPlus" onclick="changeQty(1)">+</button>
            </div>
            <button class="btn-cart" id="addCartBtn" onclick="addToCart()">
                🛒 Add to Cart
            </button>
        </div>

        <div class="meta-grid" id="metaGrid"></div>
        <div class="divider"></div>
        <div class="seller-box" id="sellerBox"></div>
    </div>

</div>

<!-- Related products -->
<div class="related-section">
    <div class="section-tag">You might also like</div>
    <div class="section-title">Related Products</div>
    <div class="related-grid" id="relatedGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    const BASE  = 'http://localhost:8080/ecommerce/api';
    const user  = JSON.parse(localStorage.getItem('user') || 'null');
    let cart    = JSON.parse(localStorage.getItem('cart') || '[]');
    let qty     = 1;
    let product = null;

    // ── Get product ID from URL ──────────────────────
    const params    = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    // ── Init ─────────────────────────────────────────
    window.addEventListener('DOMContentLoaded', () => {
        initNav();
        updateCartCount();
        if (!productId) { showError('No product ID provided.'); return; }
        fetchProduct();
    });

    function initNav() {
        if (user) {
            document.getElementById('navUser').style.display = 'flex';
            document.getElementById('navName').textContent   = user.firstName;
            document.getElementById('navAvatar').textContent =
                (user.firstName?.[0] || '') + (user.lastName?.[0] || '');
        }
    }

    // ── Fetch product ─────────────────────────────────
    async function fetchProduct() {
        try {
            const res  = await fetch(`${BASE}/products/${productId}`);
            if (!res.ok) throw new Error('Not found');
            product = await res.json();
            renderProduct(product);
            fetchRelated(product.category, product.id);
        } catch (err) {
            showError('Product not found.');
        }
    }

    // ── Render product ───────────────────────────────
    function renderProduct(p) {
        // Breadcrumb
        document.getElementById('breadcrumbName').textContent = p.name;
        document.title = p.name + ' — ShopEase';

        // Image
        const mainImg = document.getElementById('mainImg');
        const badge   = getBadge(p);
        if (p.imageUrl) {
            mainImg.innerHTML = `<img src="${p.imageUrl}" alt="${p.name}"/>${badge}`;
        } else {
            mainImg.innerHTML = `<span style="font-size:8rem;">🛍️</span>${badge}`;
        }

        // Thumbs (placeholder for extra images)
        document.getElementById('thumbRow').innerHTML = `
        <div class="thumb active">🛍️</div>
        <div class="thumb" style="opacity:0.3;">🛍️</div>
        <div class="thumb" style="opacity:0.2;">🛍️</div>
      `;

        // Info
        document.getElementById('pCat').textContent   = p.category || 'General';
        document.getElementById('pName').textContent  = p.name;
        document.getElementById('pPrice').textContent = '$' + parseFloat(p.price).toFixed(2);
        document.getElementById('pDesc').textContent  = p.description || 'No description available.';

        // Stock
        const stockEl = document.getElementById('pStock');
        const isOut   = p.status === 'OUT_OF_STOCK' || p.stockQuantity === 0;
        const isLow   = p.stockQuantity > 0 && p.stockQuantity <= 5;
        if (isOut) {
            stockEl.className = 'stock-status stock-out';
            stockEl.innerHTML = `<span class="stock-dot"></span> Out of stock`;
            document.getElementById('addCartBtn').disabled = true;
            document.getElementById('qtyMinus').disabled   = true;
            document.getElementById('qtyPlus').disabled    = true;
        } else if (isLow) {
            stockEl.className = 'stock-status stock-low';
            stockEl.innerHTML = `<span class="stock-dot"></span> Only ${p.stockQuantity} left — order soon`;
        } else {
            stockEl.className = 'stock-status stock-in';
            stockEl.innerHTML = `<span class="stock-dot"></span> In stock (${p.stockQuantity} available)`;
        }

        // Meta grid
        document.getElementById('metaGrid').innerHTML = `
        <div class="meta-item">
          <div class="meta-label">Category</div>
          <div class="meta-value">${p.category || '—'}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Stock</div>
          <div class="meta-value">${p.stockQuantity} units</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Status</div>
          <div class="meta-value">${p.status}</div>
        </div>
        <div class="meta-item">
          <div class="meta-label">Product ID</div>
          <div class="meta-value">#${p.id}</div>
        </div>
      `;

        // Seller box
        const initials = 'S' + p.sellerId;
        document.getElementById('sellerBox').innerHTML = `
        <div class="seller-avatar">${initials}</div>
        <div>
          <div class="seller-label">Sold by</div>
          <div class="seller-name">Seller #${p.sellerId}</div>
        </div>
      `;

        // Show panels, hide skeletons
        document.getElementById('imgSkeleton').style.display  = 'none';
        document.getElementById('infoSkeleton').style.display = 'none';
        document.getElementById('imgPanel').style.display     = 'block';
        document.getElementById('infoPanel').style.display    = 'block';
    }

    // ── Fetch related products ───────────────────────
    async function fetchRelated(category, excludeId) {
        try {
            const res  = await fetch(`${BASE}/products?category=${encodeURIComponent(category)}`);
            const data = await res.json();
            const list = (Array.isArray(data) ? data : data.products || [])
                .filter(p => p.id != excludeId && p.status === 'ACTIVE')
                .slice(0, 4);
            renderRelated(list);
        } catch (err) {
            document.getElementById('relatedGrid').innerHTML =
                '<p style="color:var(--muted);font-size:0.9rem;">Could not load related products.</p>';
        }
    }

    function renderRelated(list) {
        if (!list.length) {
            document.querySelector('.related-section').style.display = 'none';
            return;
        }
        document.getElementById('relatedGrid').innerHTML = list.map(p => `
        <div class="product-card" onclick="window.location.href='product.html?id=${p.id}'">
          <div class="pc-img">
            ${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}"/>` : '🛍️'}
          </div>
          <div class="pc-body">
            <div class="pc-cat">${p.category || 'General'}</div>
            <div class="pc-name">${p.name}</div>
            <div class="pc-foot">
              <div class="pc-price">$${parseFloat(p.price).toFixed(2)}</div>
              <button class="pc-add" onclick="addRelated(event,${p.id},'${p.name}',${p.price})">+</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ── Qty controls ─────────────────────────────────
    function changeQty(delta) {
        const max = product?.stockQuantity || 99;
        qty = Math.min(Math.max(1, qty + delta), max);
        document.getElementById('qtyVal').textContent    = qty;
        document.getElementById('qtyMinus').disabled     = qty <= 1;
        document.getElementById('qtyPlus').disabled      = qty >= max;
    }

    // ── Add to cart ──────────────────────────────────
    function addToCart() {
        if (!product) return;

        const existing = cart.find(i => i.id === product.id);
        if (existing) {
            existing.qty += qty;
        } else {
            cart.push({ id: product.id, name: product.name, price: parseFloat(product.price), qty });
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();

        const fb = document.getElementById('addFeedback');
        fb.className = 'add-feedback success';
        fb.textContent = `✓ ${qty} × "${product.name}" added to cart`;
        setTimeout(() => { fb.className = 'add-feedback'; }, 3000);

        showToast(`${qty} item${qty > 1 ? 's' : ''} added to cart 🛒`);
    }

    function addRelated(e, id, name, price) {
        e.stopPropagation();
        const existing = cart.find(i => i.id === id);
        if (existing) existing.qty++; else cart.push({ id, name, price: parseFloat(price), qty: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        updateCartCount();
        showToast(`"${name}" added to cart 🛒`);
    }

    // ── Helpers ──────────────────────────────────────
    function updateCartCount() {
        const total = cart.reduce((s, i) => s + i.qty, 0);
        document.getElementById('cartCount').textContent = total;
    }

    function getBadge(p) {
        const isOut = p.status === 'OUT_OF_STOCK' || p.stockQuantity === 0;
        const isLow = p.stockQuantity > 0 && p.stockQuantity <= 5;
        const isNew = p.createdAt && (Date.now() - new Date(p.createdAt)) / 86400000 <= 30;
        if (isOut) return `<span class="img-badge badge-out">Out of Stock</span>`;
        if (isLow) return `<span class="img-badge badge-low">Only ${p.stockQuantity} left</span>`;
        if (isNew) return `<span class="img-badge badge-new">New</span>`;
        return '';
    }

    function showError(msg) {
        document.getElementById('imgSkeleton').style.display  = 'none';
        document.getElementById('infoSkeleton').style.display = 'none';
        document.getElementById('productSection').innerHTML = `
        <div class="error-state">
          <h2>Product not found</h2>
          <p>${msg}</p>
          <a href="store.html" class="back-btn">← Back to Store</a>
        </div>`;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
