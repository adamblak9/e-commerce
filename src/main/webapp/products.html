<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Products — ShopEase</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0d0d0d;
            --panel:   #141414;
            --panel2:  #1a1a1a;
            --border:  #2a2a2a;
            --accent:  #c8a96e;
            --accent2: #e8c98e;
            --text:    #f0ede8;
            --muted:   #7a7470;
            --error:   #e07070;
            --success: #70c490;
            --seller:  #7eb8d4;
            --warning: #e0b870;
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
        }

        /* ── NAV ── */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 2.5rem;
            border-bottom: 1px solid var(--border);
            background: var(--panel);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--accent);
        }
        .brand span { color: var(--text); }

        .nav-right { display: flex; align-items: center; gap: 1rem; }

        .nav-user {
            font-size: 0.85rem;
            color: var(--muted);
        }
        .nav-user strong { color: var(--text); }

        .btn-sm {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            transition: all 0.2s;
        }
        .btn-sm:hover { color: var(--text); border-color: var(--muted); }

        /* ── LAYOUT ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2.5rem 2rem;
        }

        /* ── PAGE HEADER ── */
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            background: linear-gradient(135deg, var(--text) 0%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-header p { color: var(--muted); font-size: 0.88rem; margin-top: 0.3rem; }

        .btn-primary {
            padding: 0.75rem 1.4rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #0d0d0d;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        /* ── TOOLBAR ── */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: var(--accent); }
        .search-box input::placeholder { color: var(--muted); }

        .search-icon {
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
        }

        .filter-select {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .filter-select:focus { border-color: var(--accent); }
        .filter-select option { background: var(--panel); }

        /* ── STATS ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.2rem 1.4rem;
            animation: fadeUp 0.4s ease both;
        }
        .stat-card:nth-child(2) { animation-delay: 0.05s; }
        .stat-card:nth-child(3) { animation-delay: 0.10s; }
        .stat-card:nth-child(4) { animation-delay: 0.15s; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .stat-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 0.5rem; }
        .stat-value { font-size: 1.8rem; font-weight: 600; color: var(--accent); }
        .stat-sub   { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; }

        /* ── PRODUCTS GRID ── */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
        }

        .product-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: border-color 0.2s, transform 0.2s;
            animation: fadeUp 0.4s ease both;
        }
        .product-card:hover { border-color: var(--accent); transform: translateY(-2px); }

        .product-img {
            width: 100%;
            height: 180px;
            background: var(--panel2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-status-badge {
            position: absolute;
            top: 0.6rem;
            right: 0.6rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .badge-active       { background: rgba(112,196,144,0.15); color: var(--success); border: 1px solid rgba(112,196,144,0.3); }
        .badge-inactive     { background: rgba(122,116,112,0.15); color: var(--muted);   border: 1px solid rgba(122,116,112,0.3); }
        .badge-out_of_stock { background: rgba(224,112,112,0.15); color: var(--error);   border: 1px solid rgba(224,112,112,0.3); }

        .product-body { padding: 1.2rem; }

        .product-category {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--accent);
            margin-bottom: 0.4rem;
        }

        .product-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.05rem;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-desc {
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent2);
        }

        .product-stock {
            font-size: 0.78rem;
            color: var(--muted);
        }
        .product-stock.low { color: var(--warning); }

        .product-actions {
            display: flex;
            gap: 0.5rem;
            padding: 0.8rem 1.2rem;
            border-top: 1px solid var(--border);
            background: rgba(255,255,255,0.01);
        }

        .btn-action {
            flex: 1;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            transition: all 0.2s;
            text-align: center;
        }
        .btn-action:hover            { color: var(--text); border-color: var(--muted); }
        .btn-action.edit:hover       { color: var(--accent); border-color: var(--accent); }
        .btn-action.delete:hover     { color: var(--error); border-color: var(--error); }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
        .empty-state h3 { font-family: 'Playfair Display', serif; color: var(--text); margin-bottom: 0.5rem; }

        /* ── LOADING ── */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4rem;
            gap: 0.5rem;
            color: var(--muted);
        }
        .spinner {
            width: 20px; height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── MODAL ── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .overlay.show { display: flex; }

        .modal {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.25s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 1.8rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.4rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .modal-close:hover { color: var(--text); }

        .modal-body { padding: 1.8rem; }

        .field { margin-bottom: 1.2rem; }

        .field label {
            display: block;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            background: #1c1c1c;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.85rem 1rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            resize: none;
        }
        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(200,169,110,0.1);
        }
        .field input::placeholder,
        .field textarea::placeholder { color: #3a3a3a; }
        .field select option { background: #1c1c1c; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .btn-full {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #0d0d0d;
            border: none;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
            margin-top: 0.5rem;
        }
        .btn-full:hover    { opacity: 0.9; transform: translateY(-1px); }
        .btn-full:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .alert {
            padding: 0.8rem 1rem;
            border-radius: 8px;
            font-size: 0.88rem;
            margin-bottom: 1.2rem;
            display: none;
        }
        .alert.error   { background: rgba(224,112,112,0.1); border: 1px solid rgba(224,112,112,0.3); color: var(--error); }
        .alert.success { background: rgba(112,196,144,0.1); border: 1px solid rgba(112,196,144,0.3); color: var(--success); }
        .alert.show    { display: block; }

        /* ── DELETE CONFIRM ── */
        .delete-modal { max-width: 380px; text-align: center; }
        .delete-icon  { font-size: 3rem; margin-bottom: 1rem; }
        .delete-modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
        .delete-actions { display: flex; gap: 0.8rem; }
        .btn-cancel {
            flex: 1;
            padding: 0.85rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-cancel:hover { color: var(--text); border-color: var(--muted); }
        .btn-danger {
            flex: 1;
            padding: 0.85rem;
            background: rgba(224,112,112,0.15);
            border: 1px solid rgba(224,112,112,0.4);
            border-radius: 8px;
            color: var(--error);
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-danger:hover { background: rgba(224,112,112,0.25); }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.9rem 1.4rem;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: rgba(112,196,144,0.15); border: 1px solid rgba(112,196,144,0.4); color: var(--success); }
        .toast.error   { background: rgba(224,112,112,0.15); border: 1px solid rgba(224,112,112,0.4); color: var(--error); }

        @media (max-width: 768px) {
            .stats { grid-template-columns: 1fr 1fr; }
            .products-grid { grid-template-columns: 1fr; }
            nav { padding: 1rem 1.2rem; }
        }
        @media (max-width: 480px) {
            .stats { grid-template-columns: 1fr; }
            .row   { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- NAV -->
<nav>
    <div class="brand">Shop<span>Ease</span></div>
    <div class="nav-right">
        <span class="nav-user">Logged in as <strong id="navUser">—</strong></span>
        <button class="btn-sm" onclick="logout()">Sign out</button>
    </div>
</nav>

<!-- MAIN -->
<div class="container">

    <!-- Header -->
    <div class="page-header">
        <div>
            <h1>Product Management</h1>
            <p>Manage your store inventory</p>
        </div>
        <button class="btn-primary" onclick="openCreateModal()">
            + Add Product
        </button>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total Products</div>
            <div class="stat-value" id="statTotal">—</div>
            <div class="stat-sub">in catalog</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Active</div>
            <div class="stat-value" id="statActive" style="color:var(--success)">—</div>
            <div class="stat-sub">available now</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Out of Stock</div>
            <div class="stat-value" id="statOut" style="color:var(--error)">—</div>
            <div class="stat-sub">need restocking</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Categories</div>
            <div class="stat-value" id="statCats" style="color:var(--seller)">—</div>
            <div class="stat-sub">product types</div>
        </div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search products…" oninput="handleSearch()"/>
        </div>
        <select class="filter-select" id="categoryFilter" onchange="handleFilter()">
            <option value="">All Categories</option>
        </select>
        <select class="filter-select" id="statusFilter" onchange="handleFilter()">
            <option value="">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="OUT_OF_STOCK">Out of Stock</option>
        </select>
    </div>

    <!-- Products -->
    <div id="productsContainer">
        <div class="loading">
            <div class="spinner"></div>
            Loading products…
        </div>
    </div>

</div>

<!-- ── CREATE / EDIT MODAL ── -->
<div class="overlay" id="formOverlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Add Product</h3>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="alert error"   id="formError"></div>
            <div class="alert success" id="formSuccess"></div>

            <div class="field">
                <label>Product Name *</label>
                <input type="text" id="fName" placeholder="e.g. Wireless Headphones"/>
            </div>

            <div class="field">
                <label>Description</label>
                <textarea id="fDesc" rows="3" placeholder="Describe your product…"></textarea>
            </div>

            <div class="row">
                <div class="field">
                    <label>Price (USD) *</label>
                    <input type="number" id="fPrice" placeholder="0.00" min="0" step="0.01"/>
                </div>
                <div class="field">
                    <label>Stock Quantity *</label>
                    <input type="number" id="fStock" placeholder="0" min="0"/>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Category</label>
                    <input type="text" id="fCategory" placeholder="e.g. Electronics"/>
                </div>
                <div class="field">
                    <label>Status</label>
                    <select id="fStatus">
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                        <option value="OUT_OF_STOCK">Out of Stock</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Image URL</label>
                <input type="url" id="fImageUrl" placeholder="https://…"/>
            </div>

            <button class="btn-full" id="formSubmitBtn" onclick="handleFormSubmit()">
                Create Product
            </button>
        </div>
    </div>
</div>

<!-- ── DELETE MODAL ── -->
<div class="overlay" id="deleteOverlay">
    <div class="modal delete-modal">
        <div class="modal-body">
            <div class="delete-icon">🗑️</div>
            <h3 style="font-family:'Playfair Display',serif;margin-bottom:0.5rem;">Delete Product?</h3>
            <p id="deleteProductName">This action cannot be undone.</p>
            <div class="delete-actions">
                <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
    const API = 'http://localhost:8080/ecommerce/api/products';
    const token = localStorage.getItem('token');
    const user  = JSON.parse(localStorage.getItem('user') || '{}');

    // ── ROLE GUARD ────────────────────────────────────────────────────────────
    // This page is for product management — ADMIN and SELLER only.
    // CUSTOMER (or unauthenticated) users are redirected immediately.
    (function RoleGuard() {
        const allowedRoles = ['ADMIN', 'SELLER'];
        if (!token || !user.role || !allowedRoles.includes(user.role)) {
            window.location.replace('403.html');
        }
    })();
    // ─────────────────────────────────────────────────────────────────────────

    let allProducts  = [];
    let editingId    = null;
    let deletingId   = null;

    // ── INIT ─────────────────────────────────────────────────────────────────

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('navUser').textContent =
            user.firstName ? `${user.firstName} (${user.role || 'GUEST'})` : 'Guest';
        loadProducts();
    });

    // ── LOAD ALL PRODUCTS ────────────────────────────────────────────────────

    async function loadProducts() {
        showLoading();
        try {
            const res  = await fetch(API);
            const data = await res.json();
            allProducts = Array.isArray(data) ? data : [];
            renderProducts(allProducts);
            updateStats(allProducts);
            updateCategoryFilter(allProducts);
        } catch (e) {
            showError('Failed to load products. Make sure the server is running.');
        }
    }

    // ── RENDER ───────────────────────────────────────────────────────────────

    function renderProducts(products) {
        const container = document.getElementById('productsContainer');

        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📦</div>
                    <h3>No products found</h3>
                    <p>Try a different search or add your first product.</p>
                </div>`;
            return;
        }

        container.innerHTML = `<div class="products-grid">${products.map(productCard).join('')}</div>`;
    }

    function productCard(p) {
        const statusClass = `badge-${p.status.toLowerCase()}`;
        const imgContent  = p.imageUrl
            ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.style.display='none'">`
            : `<span>📦</span>`;
        const stockClass  = p.stockQuantity <= 5 ? 'low' : '';
        const canEdit     = user.role === 'ADMIN' || user.id === p.sellerId;

        return `
        <div class="product-card" id="card-${p.id}">
            <div class="product-img">
                ${imgContent}
                <span class="product-status-badge ${statusClass}">${p.status.replace('_',' ')}</span>
            </div>
            <div class="product-body">
                <div class="product-category">${p.category || 'Uncategorized'}</div>
                <div class="product-name" title="${p.name}">${p.name}</div>
                <div class="product-desc">${p.description || 'No description provided.'}</div>
                <div class="product-footer">
                    <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
                    <div class="product-stock ${stockClass}">
                        ${p.stockQuantity} in stock
                    </div>
                </div>
            </div>
            ${canEdit ? `
            <div class="product-actions">
                <button class="btn-action edit" onclick="openEditModal(${p.id})">✏️ Edit</button>
                <button class="btn-action delete" onclick="openDeleteModal(${p.id}, '${p.name.replace(/'/g,"\\'")}')">🗑️ Delete</button>
            </div>` : ''}
        </div>`;
    }

    // ── STATS ────────────────────────────────────────────────────────────────

    function updateStats(products) {
        document.getElementById('statTotal').textContent  = products.length;
        document.getElementById('statActive').textContent = products.filter(p => p.status === 'ACTIVE').length;
        document.getElementById('statOut').textContent    = products.filter(p => p.status === 'OUT_OF_STOCK').length;
        const cats = new Set(products.map(p => p.category).filter(Boolean));
        document.getElementById('statCats').textContent  = cats.size;
    }

    function updateCategoryFilter(products) {
        const cats = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
        const sel  = document.getElementById('categoryFilter');
        sel.innerHTML = '<option value="">All Categories</option>' +
            cats.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    // ── SEARCH & FILTER ──────────────────────────────────────────────────────

    let searchTimeout;
    function handleSearch() {
        clearTimeout(searchTimeout);
        const q = document.getElementById('searchInput').value.trim();
        if (q.length > 1) {
            searchTimeout = setTimeout(() => searchProducts(q), 400);
        } else {
            handleFilter();
        }
    }

    async function searchProducts(q) {
        try {
            const res  = await fetch(`${API}?search=${encodeURIComponent(q)}`);
            const data = await res.json();
            renderProducts(Array.isArray(data) ? data : []);
        } catch(e) { showToast('Search failed', 'error'); }
    }

    function handleFilter() {
        const category = document.getElementById('categoryFilter').value;
        const status   = document.getElementById('statusFilter').value;
        let filtered   = allProducts;
        if (category) filtered = filtered.filter(p => p.category === category);
        if (status)   filtered = filtered.filter(p => p.status === status);
        renderProducts(filtered);
    }

    // ── CREATE MODAL ─────────────────────────────────────────────────────────

    function openCreateModal() {
        if (!token) { showToast('Please log in first', 'error'); return; }
        editingId = null;
        clearForm();
        document.getElementById('modalTitle').textContent    = 'Add Product';
        document.getElementById('formSubmitBtn').textContent = 'Create Product';
        document.getElementById('formOverlay').classList.add('show');
    }

    // ── EDIT MODAL ───────────────────────────────────────────────────────────

    function openEditModal(id) {
        if (!token) { showToast('Please log in first', 'error'); return; }
        const p = allProducts.find(x => x.id === id);
        if (!p) return;
        editingId = id;
        clearForm();
        document.getElementById('fName').value     = p.name || '';
        document.getElementById('fDesc').value     = p.description || '';
        document.getElementById('fPrice').value    = p.price || '';
        document.getElementById('fStock').value    = p.stockQuantity ?? '';
        document.getElementById('fCategory').value = p.category || '';
        document.getElementById('fStatus').value   = p.status || 'ACTIVE';
        document.getElementById('fImageUrl').value = p.imageUrl || '';
        document.getElementById('modalTitle').textContent    = 'Edit Product';
        document.getElementById('formSubmitBtn').textContent = 'Save Changes';
        document.getElementById('formOverlay').classList.add('show');
    }

    function closeModal() {
        document.getElementById('formOverlay').classList.remove('show');
        editingId = null;
    }

    // ── FORM SUBMIT ──────────────────────────────────────────────────────────

    async function handleFormSubmit() {
        const name     = document.getElementById('fName').value.trim();
        const desc     = document.getElementById('fDesc').value.trim();
        const price    = document.getElementById('fPrice').value.trim();
        const stock    = document.getElementById('fStock').value.trim();
        const category = document.getElementById('fCategory').value.trim();
        const status   = document.getElementById('fStatus').value;
        const imageUrl = document.getElementById('fImageUrl').value.trim();
        const btn      = document.getElementById('formSubmitBtn');

        hideFormMessages();

        if (!name || !price || !stock) {
            showFormError('Name, price and stock quantity are required.');
            return;
        }

        const body = { name, description: desc, price, stockQuantity: stock, category, status, imageUrl };

        btn.disabled    = true;
        btn.textContent = editingId ? 'Saving…' : 'Creating…';

        try {
            const url     = editingId ? `${API}/${editingId}` : API;
            const method  = editingId ? 'PUT' : 'POST';
            const res     = await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });

            const data = await res.json();

            if (res.ok) {
                showToast(editingId ? 'Product updated!' : 'Product created!', 'success');
                closeModal();
                loadProducts();
            } else {
                showFormError(data.error || 'Something went wrong.');
            }
        } catch(e) {
            showFormError('Could not connect to the server.');
        } finally {
            btn.disabled    = false;
            btn.textContent = editingId ? 'Save Changes' : 'Create Product';
        }
    }

    // ── DELETE ───────────────────────────────────────────────────────────────

    function openDeleteModal(id, name) {
        deletingId = id;
        document.getElementById('deleteProductName').textContent =
            `"${name}" will be permanently deleted.`;
        document.getElementById('deleteOverlay').classList.add('show');
    }

    function closeDeleteModal() {
        document.getElementById('deleteOverlay').classList.remove('show');
        deletingId = null;
    }

    async function confirmDelete() {
        if (!deletingId) return;
        const btn = document.getElementById('confirmDeleteBtn');
        btn.disabled    = true;
        btn.textContent = 'Deleting…';
        try {
            const res = await fetch(`${API}/${deletingId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                showToast('Product deleted', 'success');
                closeDeleteModal();
                loadProducts();
            } else {
                const data = await res.json();
                showToast(data.error || 'Delete failed', 'error');
                closeDeleteModal();
            }
        } catch(e) {
            showToast('Could not connect to the server', 'error');
            closeDeleteModal();
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Delete';
        }
    }

    // ── HELPERS ──────────────────────────────────────────────────────────────

    function showLoading() {
        document.getElementById('productsContainer').innerHTML =
            '<div class="loading"><div class="spinner"></div> Loading products…</div>';
    }

    function showError(msg) {
        document.getElementById('productsContainer').innerHTML =
            `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${msg}</p></div>`;
    }

    function clearForm() {
        ['fName','fDesc','fPrice','fStock','fCategory','fImageUrl'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('fStatus').value = 'ACTIVE';
        hideFormMessages();
    }

    function showFormError(msg) {
        const el = document.getElementById('formError');
        el.textContent = msg;
        el.classList.add('show');
    }

    function hideFormMessages() {
        document.getElementById('formError').classList.remove('show');
        document.getElementById('formSuccess').classList.remove('show');
    }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className   = `toast ${type} show`;
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    // Close modals on backdrop click
    document.getElementById('formOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById('deleteOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeDeleteModal();
    });
</script>
</body>
</html>
