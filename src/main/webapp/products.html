<!DOCTYPE html>
<html lang="en">
<head>
    <script src="auth.js"></script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Products — ShopEase</title>
    <!-- Same fonts as login page: Fraunces (serif) + DM Sans (sans) -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg:         #ffffff;
            --panel:      #f9f9f8;
            --border:     #e8e8e6;
            --border2:    #d4d4d0;
            --accent:     #1a6ef5;
            --accent2:    #4488ff;
            --accentL:    rgba(26,110,245,0.08);
            --text:       #111110;
            --text2:      #3a3a38;
            --muted:      #888886;
            --error:      #e53535;
            --success:    #18a058;
            --warning:    #e68a2e;
            --shadow-sm:  0 4px 12px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        body {
            min-height: 100vh;
            background: var(--bg);
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        /* ----- Navigation (mirrors login page header) ----- */
        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            height: 70px;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            font-family: 'Fraunces', serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text);
            text-decoration: none;
        }

        .brand span {
            color: var(--accent);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .nav-user {
            font-size: 0.85rem;
            color: var(--muted);
        }

        .nav-user strong {
            color: var(--text);
            font-weight: 600;
        }

        .btn-sm {
            padding: 0.45rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            transition: all 0.2s;
        }

        .btn-sm:hover {
            color: var(--text);
            border-color: var(--border2);
        }

        /* ----- Main container ----- */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 2rem 3rem;
        }

        /* ----- Header area ----- */
        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .page-header p {
            color: var(--muted);
            font-size: 0.88rem;
            margin-top: 0.3rem;
        }

        .btn-primary {
            padding: 0.7rem 1.4rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary:hover {
            background: var(--accent2);
            transform: translateY(-1px);
        }

        /* ----- Stats cards (clean, subtle) ----- */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.2rem 1.2rem;
            transition: box-shadow 0.2s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-sm);
        }

        .stat-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent);
        }

        .stat-sub {
            font-size: 0.75rem;
            color: var(--muted);
            margin-top: 0.2rem;
        }

        /* ----- Toolbar (search + filters) ----- */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
        }

        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accentL);
            background: var(--bg);
        }

        .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.9rem;
        }

        .filter-select {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            outline: none;
            cursor: pointer;
            transition: border 0.15s;
        }

        .filter-select:focus {
            border-color: var(--accent);
        }

        /* ----- Products grid (cards) ----- */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            border-color: var(--accentL);
        }

        .product-img {
            width: 100%;
            height: 180px;
            background: var(--panel);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            border-bottom: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-status-badge {
            position: absolute;
            top: 0.7rem;
            right: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            backdrop-filter: blur(2px);
        }

        .badge-active {
            background: rgba(24, 160, 88, 0.12);
            color: var(--success);
            border: 1px solid rgba(24, 160, 88, 0.25);
        }

        .badge-inactive {
            background: rgba(136, 136, 134, 0.12);
            color: var(--muted);
            border: 1px solid rgba(136, 136, 134, 0.25);
        }

        .badge-out_of_stock {
            background: rgba(229, 53, 53, 0.08);
            color: var(--error);
            border: 1px solid rgba(229, 53, 53, 0.25);
        }

        .product-body {
            padding: 1.2rem;
        }

        .product-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--accent);
            margin-bottom: 0.4rem;
            font-weight: 500;
        }

        .product-name {
            font-family: 'Fraunces', serif;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .product-desc {
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent);
        }

        .product-stock {
            font-size: 0.75rem;
            color: var(--muted);
        }

        .product-stock.low {
            color: var(--warning);
        }

        .product-actions {
            display: flex;
            gap: 0.6rem;
            padding: 0.8rem 1rem;
            border-top: 1px solid var(--border);
            background: var(--panel);
        }

        .btn-action {
            flex: 1;
            padding: 0.5rem;
            border-radius: 8px;
            font-size: 0.8rem;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text2);
            transition: all 0.2s;
            text-align: center;
        }

        .btn-action.edit:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-action.delete:hover {
            border-color: var(--error);
            color: var(--error);
        }

        /* ----- Modals (consistent with login's clean style) ----- */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(3px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .overlay.show {
            display: flex;
        }

        .modal {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            animation: modalFadeIn 0.2s ease;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.2s;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text);
        }

        .modal-body {
            padding: 1.5rem;
        }

        .field {
            margin-bottom: 1.2rem;
        }

        .field label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.45rem;
            font-weight: 600;
        }

        .field input,
        .field textarea,
        .field select {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.8rem 1rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border 0.15s, box-shadow 0.15s;
            resize: vertical;
        }

        .field input:focus,
        .field textarea:focus,
        .field select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accentL);
            background: var(--bg);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn-full {
            width: 100%;
            padding: 0.9rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn-full:hover {
            background: var(--accent2);
        }

        .btn-full:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert {
            padding: 0.7rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
            display: none;
        }

        .alert.error {
            background: rgba(229, 53, 53, 0.07);
            border: 1px solid rgba(229, 53, 53, 0.2);
            color: var(--error);
        }

        .alert.success {
            background: rgba(24, 160, 88, 0.07);
            border: 1px solid rgba(24, 160, 88, 0.2);
            color: var(--success);
        }

        .alert.show {
            display: block;
        }

        /* Delete modal specific */
        .delete-modal {
            max-width: 380px;
            text-align: center;
        }

        .delete-icon {
            font-size: 2.2rem;
            margin-bottom: 0.8rem;
        }

        .delete-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
        }

        .btn-cancel {
            flex: 1;
            padding: 0.75rem;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text2);
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-cancel:hover {
            border-color: var(--border2);
            color: var(--text);
        }

        .btn-danger {
            flex: 1;
            padding: 0.75rem;
            background: rgba(229, 53, 53, 0.05);
            border: 1px solid rgba(229, 53, 53, 0.3);
            border-radius: 10px;
            color: var(--error);
            font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-danger:hover {
            background: rgba(229, 53, 53, 0.1);
        }

        /* Empty / loading states */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            background: var(--panel);
            border-radius: 24px;
            border: 1px solid var(--border);
        }

        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 0.8rem;
        }

        .empty-state h3 {
            font-family: 'Fraunces', serif;
            margin-bottom: 0.3rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 3rem;
            color: var(--muted);
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 500;
            background: var(--bg);
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            z-index: 300;
            transform: translateY(100px);
            opacity: 0;
            transition: transform 0.2s, opacity 0.2s;
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid var(--success);
            color: var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--error);
            color: var(--error);
        }

        @media (max-width: 780px) {
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            .container {
                padding: 1.2rem;
            }

            nav {
                padding: 0 1rem;
            }

            .row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<!-- NAVIGATION (consistent with login) -->
<nav>
    <a href="store.html" class="brand">Shop<span>Ease</span></a>
    <div class="nav-right">
        <span class="nav-user">Logged in as <strong id="navUser">—</strong></span>
        <button class="btn-sm" onclick="logout()">Sign out</button>
    </div>
</nav>

<!-- MAIN CONTENT -->
<div class="container">
    <div class="page-header">
        <div>
            <h1>Product Management</h1>
            <p>Manage your store inventory</p>
        </div>
        <button class="btn-primary" onclick="openCreateModal()">+ Add Product</button>
    </div>

    <!-- Stats cards -->
    <div class="stats">
        <div class="stat-card">
            <div class="stat-label">Total Products</div>
            <div class="stat-value" id="statTotal">—</div>
            <div class="stat-sub">in catalog</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Active</div>
            <div class="stat-value" id="statActive" style="color:var(--success)">—</div>
            <div class="stat-sub">available now</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Out of Stock</div>
            <div class="stat-value" id="statOut" style="color:var(--error)">—</div>
            <div class="stat-sub">need restocking</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Categories</div>
            <div class="stat-value" id="statCats" style="color:var(--accent2)">—</div>
            <div class="stat-sub">product types</div>
        </div>
    </div>

    <!-- Filters toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search products…" oninput="handleSearch()"/>
        </div>
        <select class="filter-select" id="categoryFilter" onchange="handleFilter()">
            <option value="">All Categories</option>
        </select>
        <select class="filter-select" id="statusFilter" onchange="handleFilter()">
            <option value="">All Status</option>
            <option value="ACTIVE">Active</option>
            <option value="INACTIVE">Inactive</option>
            <option value="OUT_OF_STOCK">Out of Stock</option>
        </select>
    </div>

    <!-- Products grid container -->
    <div id="productsContainer">
        <div class="loading">
            <div class="spinner"></div>
            Loading products…
        </div>
    </div>
</div>

<!-- Modal: Create / Edit Product -->
<div class="overlay" id="formOverlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalTitle">Add Product</h3>
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
            <div class="alert error" id="formError"></div>
            <div class="alert success" id="formSuccess"></div>

            <div class="field">
                <label>Product Name *</label>
                <input type="text" id="fName" placeholder="e.g. Wireless Headphones"/>
            </div>

            <div class="field">
                <label>Description</label>
                <textarea id="fDesc" rows="3" placeholder="Describe your product…"></textarea>
            </div>

            <div class="row">
                <div class="field">
                    <label>Price (USD) *</label>
                    <input type="number" id="fPrice" placeholder="0.00" min="0" step="0.01"/>
                </div>
                <div class="field">
                    <label>Stock Quantity *</label>
                    <input type="number" id="fStock" placeholder="0" min="0"/>
                </div>
            </div>

            <div class="row">
                <div class="field">
                    <label>Category</label>
                    <input type="text" id="fCategory" placeholder="e.g. Electronics"/>
                </div>
                <div class="field">
                    <label>Status</label>
                    <select id="fStatus">
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                        <option value="OUT_OF_STOCK">Out of Stock</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label>Image URL</label>
                <input type="url" id="fImageUrl" placeholder="https://…"/>
            </div>

            <button class="btn-full" id="formSubmitBtn" onclick="handleFormSubmit()">Create Product</button>
        </div>
    </div>
</div>

<!-- Modal: Delete confirmation -->
<div class="overlay" id="deleteOverlay">
    <div class="modal delete-modal">
        <div class="modal-body">
            <div class="delete-icon">🗑️</div>
            <h3 style="font-family:'Fraunces',serif; margin-bottom:0.3rem;">Delete product?</h3>
            <p id="deleteProductName" style="color: var(--muted); font-size:0.85rem;">This action cannot be undone.</p>
            <div class="delete-actions">
                <button class="btn-cancel" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">Delete</button>
            </div>
        </div>
    </div>
</div>

<!-- Toast message -->
<div class="toast" id="toast"></div>

<script>
    // ====================== ORIGINAL LOGIC (unchanged) ======================
    const API = 'http://localhost:8080/ecommerce/api/products';
    const token = localStorage.getItem('token');
    const user  = JSON.parse(localStorage.getItem('user') || '{}');

    // Role guard: only ADMIN or SELLER can access this page
    (function RoleGuard() {
        const allowedRoles = ['ADMIN', 'SELLER'];
        if (!token || !user.role || !allowedRoles.includes(user.role)) {
            window.location.replace('403.html');
        }
    })();

    let allProducts  = [];
    let editingId    = null;
    let deletingId   = null;

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('navUser').textContent =
            user.firstName ? `${user.firstName} (${user.role || 'GUEST'})` : 'Guest';
        loadProducts();
    });

    async function loadProducts() {
        showLoading();
        try {
            const res  = await fetch(API);
            const data = await res.json();
            allProducts = Array.isArray(data) ? data : [];
            renderProducts(allProducts);
            updateStats(allProducts);
            updateCategoryFilter(allProducts);
        } catch (e) {
            showError('Failed to load products. Make sure the server is running.');
        }
    }

    function renderProducts(products) {
        const container = document.getElementById('productsContainer');
        if (products.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📦</div>
                    <h3>No products found</h3>
                    <p>Try a different search or add your first product.</p>
                </div>`;
            return;
        }
        container.innerHTML = `<div class="products-grid">${products.map(productCard).join('')}</div>`;
    }

    function productCard(p) {
        const statusClass = `badge-${p.status.toLowerCase()}`;
        const imgContent  = p.imageUrl
            ? `<img src="${p.imageUrl}" alt="${p.name}" onerror="this.style.display='none'">`
            : `<span>📦</span>`;
        const stockClass  = p.stockQuantity <= 5 ? 'low' : '';
        const canEdit     = user.role === 'ADMIN' || user.id === p.sellerId;

        return `
        <div class="product-card">
            <div class="product-img">
                ${imgContent}
                <span class="product-status-badge ${statusClass}">${p.status.replace('_',' ')}</span>
            </div>
            <div class="product-body">
                <div class="product-category">${p.category || 'Uncategorized'}</div>
                <div class="product-name" title="${p.name}">${escapeHtml(p.name)}</div>
                <div class="product-desc">${escapeHtml(p.description || 'No description provided.')}</div>
                <div class="product-footer">
                    <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
                    <div class="product-stock ${stockClass}">${p.stockQuantity} in stock</div>
                </div>
            </div>
            ${canEdit ? `
            <div class="product-actions">
                <button class="btn-action edit" onclick="openEditModal(${p.id})">✏️ Edit</button>
                <button class="btn-action delete" onclick="openDeleteModal(${p.id}, '${escapeJs(p.name)}')">🗑️ Delete</button>
            </div>` : ''}
        </div>`;
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function escapeJs(str) {
        if (!str) return '';
        return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function updateStats(products) {
        document.getElementById('statTotal').textContent  = products.length;
        document.getElementById('statActive').textContent = products.filter(p => p.status === 'ACTIVE').length;
        document.getElementById('statOut').textContent    = products.filter(p => p.status === 'OUT_OF_STOCK').length;
        const cats = new Set(products.map(p => p.category).filter(Boolean));
        document.getElementById('statCats').textContent  = cats.size;
    }

    function updateCategoryFilter(products) {
        const cats = [...new Set(products.map(p => p.category).filter(Boolean))].sort();
        const sel  = document.getElementById('categoryFilter');
        sel.innerHTML = '<option value="">All Categories</option>' +
            cats.map(c => `<option value="${c}">${escapeHtml(c)}</option>`).join('');
    }

    let searchTimeout;
    function handleSearch() {
        clearTimeout(searchTimeout);
        const q = document.getElementById('searchInput').value.trim();
        if (q.length > 1) {
            searchTimeout = setTimeout(() => searchProducts(q), 400);
        } else {
            handleFilter();
        }
    }

    async function searchProducts(q) {
        try {
            const res  = await fetch(`${API}?search=${encodeURIComponent(q)}`);
            const data = await res.json();
            renderProducts(Array.isArray(data) ? data : []);
        } catch(e) { showToast('Search failed', 'error'); }
    }

    function handleFilter() {
        const category = document.getElementById('categoryFilter').value;
        const status   = document.getElementById('statusFilter').value;
        let filtered   = allProducts;
        if (category) filtered = filtered.filter(p => p.category === category);
        if (status)   filtered = filtered.filter(p => p.status === status);
        renderProducts(filtered);
    }

    function openCreateModal() {
        if (!token) { showToast('Please log in first', 'error'); return; }
        editingId = null;
        clearForm();
        document.getElementById('modalTitle').textContent    = 'Add Product';
        document.getElementById('formSubmitBtn').textContent = 'Create Product';
        document.getElementById('formOverlay').classList.add('show');
    }

    function openEditModal(id) {
        if (!token) { showToast('Please log in first', 'error'); return; }
        const p = allProducts.find(x => x.id === id);
        if (!p) return;
        editingId = id;
        clearForm();
        document.getElementById('fName').value     = p.name || '';
        document.getElementById('fDesc').value     = p.description || '';
        document.getElementById('fPrice').value    = p.price || '';
        document.getElementById('fStock').value    = p.stockQuantity ?? '';
        document.getElementById('fCategory').value = p.category || '';
        document.getElementById('fStatus').value   = p.status || 'ACTIVE';
        document.getElementById('fImageUrl').value = p.imageUrl || '';
        document.getElementById('modalTitle').textContent    = 'Edit Product';
        document.getElementById('formSubmitBtn').textContent = 'Save Changes';
        document.getElementById('formOverlay').classList.add('show');
    }

    function closeModal() {
        document.getElementById('formOverlay').classList.remove('show');
        editingId = null;
    }

    async function handleFormSubmit() {
        const name     = document.getElementById('fName').value.trim();
        const desc     = document.getElementById('fDesc').value.trim();
        const price    = document.getElementById('fPrice').value.trim();
        const stock    = document.getElementById('fStock').value.trim();
        const category = document.getElementById('fCategory').value.trim();
        const status   = document.getElementById('fStatus').value;
        const imageUrl = document.getElementById('fImageUrl').value.trim();
        const btn      = document.getElementById('formSubmitBtn');

        hideFormMessages();
        if (!name || !price || !stock) {
            showFormError('Name, price and stock quantity are required.');
            return;
        }
        const body = { name, description: desc, price, stockQuantity: stock, category, status, imageUrl };

        btn.disabled    = true;
        btn.textContent = editingId ? 'Saving…' : 'Creating…';

        try {
            const url     = editingId ? `${API}/${editingId}` : API;
            const method  = editingId ? 'PUT' : 'POST';
            const res     = await fetch(url, {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (res.ok) {
                showToast(editingId ? 'Product updated!' : 'Product created!', 'success');
                closeModal();
                loadProducts();
            } else {
                showFormError(data.error || 'Something went wrong.');
            }
        } catch(e) {
            showFormError('Could not connect to the server.');
        } finally {
            btn.disabled    = false;
            btn.textContent = editingId ? 'Save Changes' : 'Create Product';
        }
    }

    function openDeleteModal(id, name) {
        deletingId = id;
        document.getElementById('deleteProductName').innerHTML = `"${escapeHtml(name)}" will be permanently deleted.`;
        document.getElementById('deleteOverlay').classList.add('show');
    }

    function closeDeleteModal() {
        document.getElementById('deleteOverlay').classList.remove('show');
        deletingId = null;
    }

    async function confirmDelete() {
        if (!deletingId) return;
        const btn = document.getElementById('confirmDeleteBtn');
        btn.disabled    = true;
        btn.textContent = 'Deleting…';
        try {
            const res = await fetch(`${API}/${deletingId}`, {
                method: 'DELETE',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (res.ok) {
                showToast('Product deleted', 'success');
                closeDeleteModal();
                loadProducts();
            } else {
                const data = await res.json();
                showToast(data.error || 'Delete failed', 'error');
                closeDeleteModal();
            }
        } catch(e) {
            showToast('Could not connect to the server', 'error');
            closeDeleteModal();
        } finally {
            btn.disabled    = false;
            btn.textContent = 'Delete';
        }
    }

    function showLoading() {
        document.getElementById('productsContainer').innerHTML =
            '<div class="loading"><div class="spinner"></div> Loading products…</div>';
    }

    function showError(msg) {
        document.getElementById('productsContainer').innerHTML =
            `<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>${msg}</p></div>`;
    }

    function clearForm() {
        ['fName','fDesc','fPrice','fStock','fCategory','fImageUrl'].forEach(id => {
            document.getElementById(id).value = '';
        });
        document.getElementById('fStatus').value = 'ACTIVE';
        hideFormMessages();
    }

    function showFormError(msg) {
        const el = document.getElementById('formError');
        el.textContent = msg;
        el.classList.add('show');
    }

    function hideFormMessages() {
        document.getElementById('formError').classList.remove('show');
        document.getElementById('formSuccess').classList.remove('show');
    }

    function showToast(msg, type = 'success') {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = `toast ${type} show`;
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    function logout() {
        localStorage.removeItem('token');
        localStorage.removeItem('user');
        window.location.href = 'login.html';
    }

    // backdrop close
    document.getElementById('formOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeModal();
    });
    document.getElementById('deleteOverlay').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeDeleteModal();
    });
</script>
</body>
</html>
